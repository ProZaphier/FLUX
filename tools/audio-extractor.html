<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Audio Extractor | FLUX</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #07090f;
            color: #ffffff;
            min-height: 100vh;
        }

        /* NAVBAR */

        nav {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            background: rgba(7,9,15,0.9);
        }

        .logo {
            font-size: 25px;
            font-weight: 900;
            letter-spacing: 5px;
            color: #ffffff;
            text-decoration: none;
        }

        .back {
            color: #aab2c5;
            text-decoration: none;
            font-size: 14px;
            transition: 0.2s;
        }

        .back:hover {
            color: #ffffff;
        }

        /* MAIN */

        main {
            width: min(900px, 90%);
            margin: 80px auto;
        }

        .heading {
            text-align: center;
            margin-bottom: 45px;
        }

        .heading .tag {
            color: #5da9ff;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        h1 {
            font-size: clamp(42px, 7vw, 72px);
            letter-spacing: -3px;
            margin-bottom: 15px;
        }

        .heading p {
            color: #9299aa;
            font-size: 16px;
            line-height: 1.6;
        }

        /* EXTRACTOR */

        .extractor {
            background: #0d111c;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 22px;
            padding: 35px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.35);
        }

        .upload {
            border: 2px dashed #27344d;
            border-radius: 16px;
            min-height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            transition: 0.25s;
            padding: 30px;
        }

        .upload:hover {
            border-color: #5da9ff;
            background: rgba(93,169,255,0.03);
        }

        .upload-icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .upload h2 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .upload p {
            color: #777f91;
            font-size: 14px;
        }

        #fileInput {
            display: none;
        }

        /* FILE INFO */

        .file-info {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #090c14;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.07);
        }

        .file-name {
            font-weight: bold;
            margin-bottom: 8px;
            word-break: break-all;
        }

        .file-details {
            color: #7f8798;
            font-size: 13px;
        }

        /* BUTTON */

        .extract-btn {
            width: 100%;
            margin-top: 20px;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: #ffffff;
            color: #05070b;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .extract-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255,255,255,0.08);
        }

        .extract-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* STATUS */

        .status {
            margin-top: 20px;
            text-align: center;
            color: #7f8798;
            font-size: 14px;
            min-height: 20px;
        }

        /* MOBILE */

        @media (max-width: 600px) {
            main {
                margin: 50px auto;
            }

            .extractor {
                padding: 20px;
            }

            .upload {
                min-height: 220px;
            }

            h1 {
                letter-spacing: -2px;
            }
        }
    </style>
</head>

<body>

<nav>
    <a href="../index.html" class="logo">FLUX</a>
    <a href="../index.html" class="back">← Back to FLUX</a>
</nav>

<main>

    <div class="heading">
        <div class="tag">FLUX TOOLKIT</div>

        <h1>Audio Extractor</h1>

        <p>
            Extract the audio from a video directly in your browser.
            No uploads. No servers. No mysterious internet wizardry.
        </p>
    </div>

    <section class="extractor">

        <label class="upload" for="fileInput">

            <div>
                <div class="upload-icon">↥</div>

                <h2>Select a video</h2>

                <p>
                    MP4, MOV, WebM and other browser-supported formats
                </p>
            </div>

        </label>

        <input
            type="file"
            id="fileInput"
            accept="video/*"
        >

        <div class="file-info" id="fileInfo">

            <div class="file-name" id="fileName"></div>

            <div class="file-details" id="fileDetails"></div>

        </div>

        <button
            class="extract-btn"
            id="extractBtn"
            disabled
        >
            Extract Audio
        </button>

        <div class="status" id="status"></div>

    </section>

</main>

<script>

const fileInput = document.getElementById("fileInput");
const fileInfo = document.getElementById("fileInfo");
const fileName = document.getElementById("fileName");
const fileDetails = document.getElementById("fileDetails");
const extractBtn = document.getElementById("extractBtn");
const status = document.getElementById("status");

let selectedFile = null;


/* FILE SELECTION */

fileInput.addEventListener("change", function () {

    selectedFile = this.files[0];

    if (!selectedFile) {
        return;
    }

    fileInfo.style.display = "block";

    fileName.textContent = selectedFile.name;

    const sizeMB = (selectedFile.size / 1024 / 1024).toFixed(2);

    fileDetails.textContent =
        `${sizeMB} MB • ${selectedFile.type || "Unknown format"}`;

    extractBtn.disabled = false;

    status.textContent = "";

});


/* AUDIO EXTRACTION */

extractBtn.addEventListener("click", async function () {

    if (!selectedFile) {
        return;
    }

    extractBtn.disabled = true;

    status.textContent = "Reading video...";

    try {

        const arrayBuffer = await selectedFile.arrayBuffer();

        status.textContent = "Extracting audio...";

        const audioContext = new AudioContext();

        const audioBuffer =
            await audioContext.decodeAudioData(arrayBuffer);

        status.textContent = "Creating WAV file...";

        const wavBlob = audioBufferToWav(audioBuffer);

        const url = URL.createObjectURL(wavBlob);

        const link = document.createElement("a");

        link.href = url;

        const originalName =
            selectedFile.name.replace(/\.[^/.]+$/, "");

        link.download = originalName + ".wav";

        document.body.appendChild(link);

        link.click();

        link.remove();

        URL.revokeObjectURL(url);

        status.textContent = "Audio extracted successfully.";

        await audioContext.close();

    } catch (error) {

        console.error(error);

        status.textContent =
            "This video format could not be processed by your browser.";

    }

    extractBtn.disabled = false;

});


/* WAV ENCODER */

function audioBufferToWav(buffer) {

    const numberOfChannels = buffer.numberOfChannels;
    const sampleRate = buffer.sampleRate;
    const format = 1;
    const bitDepth = 16;

    const channelData = [];

    for (let channel = 0; channel < numberOfChannels; channel++) {
        channelData.push(buffer.getChannelData(channel));
    }

    const length =
        buffer.length * numberOfChannels * 2;

    const arrayBuffer =
        new ArrayBuffer(44 + length);

    const view =
        new DataView(arrayBuffer);


    /* RIFF HEADER */

    writeString(view, 0, "RIFF");

    view.setUint32(4, 36 + length, true);

    writeString(view, 8, "WAVE");

    writeString(view, 12, "fmt ");

    view.setUint32(16, 16, true);

    view.setUint16(20, format, true);

    view.setUint16(22, numberOfChannels, true);

    view.setUint32(24, sampleRate, true);

    view.setUint32(
        28,
        sampleRate * numberOfChannels * 2,
        true
    );

    view.setUint16(
        32,
        numberOfChannels * 2,
        true
    );

    view.setUint16(34, bitDepth, true);

    writeString(view, 36, "data");

    view.setUint32(40, length, true);


    /* AUDIO DATA */

    let offset = 44;

    for (let i = 0; i < buffer.length; i++) {

        for (let channel = 0; channel < numberOfChannels; channel++) {

            let sample = channelData[channel][i];

            sample = Math.max(-1, Math.min(1, sample));

            const value =
                sample < 0
                    ? sample * 0x8000
                    : sample * 0x7FFF;

            view.setInt16(offset, value, true);

            offset += 2;
        }
    }

    return new Blob(
        [arrayBuffer],
        { type: "audio/wav" }
    );
}


function writeString(view, offset, string) {

    for (let i = 0; i < string.length; i++) {

        view.setUint8(
            offset + i,
            string.charCodeAt(i)
        );

    }

}

</script>

</body>
</html>
