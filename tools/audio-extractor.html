<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Extractor | FLUX</title>

    <style>
        :root {
            --bg: #03050a;
            --line: rgba(174, 196, 225, 0.13);
            --text: #f2f5fa;
            --muted: #8992a4;
            --blue: #6ba8ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, "Segoe UI", sans-serif;
            background:
                radial-gradient(ellipse at 50% -20%, rgba(44, 91, 151, 0.22), transparent 58%),
                radial-gradient(ellipse at 85% 65%, rgba(20, 97, 122, 0.11), transparent 35%),
                var(--bg);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.3;
            background-image:
                radial-gradient(1px 1px at 12% 22%, #fff 50%, transparent 100%),
                radial-gradient(1px 1px at 74% 34%, #adcfff 50%, transparent 100%);
            background-size: 290px 230px;
        }

        /* Navigation */

        nav {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 76px;
            padding: 0 7%;
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
            background: rgba(3, 5, 10, 0.62);
            backdrop-filter: blur(18px);
        }

        .logo {
            color: #f6f8fc;
            font-size: 21px;
            font-weight: 850;
            letter-spacing: 5px;
            text-decoration: none;
        }

        .back {
            color: #9da8b9;
            font-size: 13px;
            text-decoration: none;
        }

        /* Page heading */

        main {
            position: relative;
            width: min(1040px, 90%);
            margin: 8vh auto 70px;
        }

        .heading {
            margin-bottom: 42px;
            text-align: center;
        }

        .heading .tag {
            margin-bottom: 17px;
            color: #83b9ff;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 3px;
        }

        h1 {
            margin-bottom: 18px;
            background: linear-gradient(#fff, #bac8dc);
            background-clip: text;
            color: transparent;
            font-size: clamp(42px, 7vw, 76px);
            font-weight: 650;
            letter-spacing: -0.065em;
            line-height: 0.98;
        }

        .heading p {
            max-width: 570px;
            margin: auto;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.7;
        }

        /* Extractor workspace */

        .extractor {
            position: relative;
            max-width: 820px;
            margin: auto;
            padding: clamp(20px, 4vw, 38px);
            border: 1px solid rgba(181, 205, 235, 0.16);
            border-radius: 22px;
            background: linear-gradient(
                145deg,
                rgba(19, 28, 43, 0.76),
                rgba(7, 11, 18, 0.78)
            );
            box-shadow:
                0 30px 90px rgba(0, 0, 0, 0.4),
                inset 0 1px rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(22px);
        }

        .workspace-top {
            display: flex;
            justify-content: space-between;
            margin-bottom: 22px;
            color: #8999af;
            font: 10px ui-monospace, monospace;
            letter-spacing: 1px;
        }

        .live {
            color: #8fddb9;
        }

        .live::before {
            content: "● ";
            color: #73d7a6;
        }

        /* Decorative audio signal */

        .signal {
            position: relative;
            display: grid;
            height: 100px;
            place-items: center;
            overflow: hidden;
            margin-bottom: 18px;
            border: 1px solid rgba(157, 190, 231, 0.1);
            border-radius: 13px;
            background:
                repeating-linear-gradient(
                    90deg,
                    transparent 0,
                    transparent 39px,
                    rgba(255, 255, 255, 0.035) 40px
                ),
                linear-gradient(180deg, #060c15, #070e17);
        }

        .wave {
            width: 94%;
            height: 70px;
            filter: drop-shadow(0 0 7px rgba(82, 181, 233, 0.4));
        }

        .wave path {
            fill: none;
            stroke: #82d9ed;
            stroke-width: 2;
            stroke-linecap: round;
        }

        .signal-caption,
        .signal-end {
            position: absolute;
            color: #718198;
            font: 9px ui-monospace, monospace;
            letter-spacing: 1px;
        }

        .signal-caption {
            top: 12px;
            left: 14px;
        }

        .signal-end {
            right: 14px;
            bottom: 10px;
        }

        /* Video file picker */

        .upload {
            display: flex;
            min-height: 178px;
            align-items: center;
            justify-content: center;
            border: 1px dashed rgba(129, 164, 211, 0.27);
            border-radius: 15px;
            background: rgba(7, 13, 22, 0.46);
            cursor: pointer;
            text-align: center;
            transition: 0.25s;
        }

        .upload:hover {
            border-color: var(--blue);
            background: rgba(49, 91, 150, 0.11);
        }

        .upload-icon {
            display: grid;
            width: 42px;
            height: 42px;
            place-items: center;
            margin: 0 auto 13px;
            border: 1px solid rgba(134, 190, 255, 0.2);
            border-radius: 13px;
            background: rgba(96, 158, 235, 0.1);
            color: #9ccaff;
            font-size: 21px;
        }

        .upload h2 {
            margin-bottom: 7px;
            font-size: 15px;
        }

        .upload p {
            color: var(--muted);
            font-size: 12px;
            line-height: 1.6;
        }

        #fileInput {
            display: none;
        }

        /* Selected file information */

        .file-info {
            display: none;
            margin-top: 17px;
            padding: 16px 18px;
            border: 1px solid rgba(133, 174, 224, 0.16);
            border-radius: 12px;
            background: rgba(5, 10, 17, 0.55);
        }

        .file-name {
            overflow-wrap: anywhere;
            font-size: 13px;
            font-weight: 600;
        }

        .file-details {
            margin-top: 7px;
            color: #8999af;
            font: 11px ui-monospace, monospace;
        }

        /* Extract button and status */

        .extract-btn {
            width: 100%;
            height: 50px;
            margin-top: 18px;
            border: 1px solid rgba(173, 210, 255, 0.6);
            border-radius: 11px;
            background: linear-gradient(110deg, #d8eaff, #8dc3ff);
            color: #07101c;
            cursor: pointer;
            font-size: 13px;
            font-weight: 750;
            transition: 0.2s;
        }

        .extract-btn:hover:not(:disabled) {
            filter: brightness(1.08);
            transform: translateY(-1px);
        }

        .extract-btn:disabled {
            cursor: not-allowed;
            opacity: 0.38;
        }

        .status {
            min-height: 19px;
            margin-top: 13px;
            color: #93bfea;
            font-size: 12px;
            text-align: center;
        }

        /* Workspace footer */

        .footer-meta {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 25px;
            color: #687385;
            font: 9px ui-monospace, monospace;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .footer-meta span::before {
            content: "•";
            margin-right: 7px;
            color: var(--blue);
        }

        /* Small screens */

        @media (max-width: 600px) {
            nav {
                height: 66px;
                padding: 0 6%;
            }

            main {
                width: 92%;
                margin: 48px auto;
            }

            .heading {
                margin-bottom: 30px;
            }

            .extractor {
                padding: 18px;
                border-radius: 18px;
            }

            .signal {
                height: 86px;
            }

            .footer-meta {
                flex-wrap: wrap;
                gap: 12px;
            }
        }
    </style>
</head>

<body>
    <nav>
        <a href="../index.html" class="logo">FLUX</a>
        <a href="../index.html" class="back">← Back to FLUX</a>
    </nav>

    <main>
        <header class="heading">
            <div class="tag">FLUX TOOLKIT / AUDIO LAB</div>
            <h1>Extract / Audio</h1>
            <p>
                Separate the soundtrack from your video. Your media stays
                in this browser and is never uploaded.
            </p>
        </header>

        <section class="extractor" aria-label="Audio extraction workspace">
            <div class="workspace-top">
                <span>SIGNAL WORKSPACE / 01</span>
                <span class="live">LOCAL PROCESSING</span>
            </div>

            <div class="signal" aria-hidden="true">
                <span class="signal-caption">AUDIO SIGNAL · STEREO</span>

                <svg
                    class="wave"
                    viewBox="0 0 800 80"
                    preserveAspectRatio="none"
                >
                    <path d="M0 40L20 40 30 25 40 55 50 32 60 40 90 40 100 35 110 48 120 18 130 62 140 30 150 40 180 40 190 22 200 58 210 34 220 40 250 40 260 37 270 44 280 15 290 65 300 28 310 40 340 40 350 24 360 56 370 33 380 40 410 40 420 36 430 47 440 20 450 60 460 31 470 40 500 40 510 25 520 55 530 34 540 40 570 40 580 37 590 45 600 17 610 63 620 29 630 40 660 40 670 23 680 57 690 32 700 40 730 40 740 36 750 46 760 19 770 61 780 33 800 40" />
                </svg>

                <span class="signal-end">20 HZ — 20 KHZ</span>
            </div>

            <label class="upload" for="fileInput">
                <div>
                    <div class="upload-icon">↥</div>
                    <h2>Select a video</h2>
                    <p>
                        MP4, MOV, WebM and other browser-supported formats<br>
                        or drop a file here
                    </p>
                </div>
            </label>

            <input type="file" id="fileInput" accept="video/*">

            <div class="file-info" id="fileInfo">
                <div class="file-name" id="fileName"></div>
                <div class="file-details" id="fileDetails"></div>
            </div>

            <button class="extract-btn" id="extractBtn" disabled>
                Extract Audio&nbsp; →
            </button>

            <div class="status" id="status" role="status" aria-live="polite"></div>

            <div class="footer-meta">
                <span>Output / WAV</span>
                <span>Decoded in browser</span>
                <span>No server transfer</span>
            </div>
        </section>
    </main>

    <script>
        // Elements used by the extractor.
        const fileInput = document.getElementById("fileInput");
        const fileInfo = document.getElementById("fileInfo");
        const fileName = document.getElementById("fileName");
        const fileDetails = document.getElementById("fileDetails");
        const extractBtn = document.getElementById("extractBtn");
        const status = document.getElementById("status");

        let selectedFile = null;

        // Show the selected video's name and size.
        fileInput.addEventListener("change", function () {
            selectedFile = this.files[0];

            if (!selectedFile) {
                return;
            }

            fileInfo.style.display = "block";
            fileName.textContent = selectedFile.name;

            const sizeMB = (selectedFile.size / 1024 / 1024).toFixed(2);

            fileDetails.textContent =
                `${sizeMB} MB • ${selectedFile.type || "Unknown format"}`;

            extractBtn.disabled = false;
            status.textContent = "";
        });

        // Decode the video's audio, convert it to WAV, and download it.
        extractBtn.addEventListener("click", async function () {
            if (!selectedFile) {
                return;
            }

            extractBtn.disabled = true;
            status.textContent = "Reading video...";

            try {
                const arrayBuffer = await selectedFile.arrayBuffer();

                status.textContent = "Extracting audio...";

                const audioContext = new AudioContext();
                const audioBuffer =
                    await audioContext.decodeAudioData(arrayBuffer);

                status.textContent = "Creating WAV file...";

                const wavBlob = audioBufferToWav(audioBuffer);
                const url = URL.createObjectURL(wavBlob);
                const link = document.createElement("a");

                link.href = url;

                const originalName =
                    selectedFile.name.replace(/\.[^/.]+$/, "");

                link.download = originalName + ".wav";

                document.body.appendChild(link);
                link.click();
                link.remove();

                URL.revokeObjectURL(url);

                status.textContent = "Audio extracted successfully.";

                await audioContext.close();
            } catch (error) {
                console.error(error);

                status.textContent =
                    "This video format could not be processed by your browser.";
            }

            extractBtn.disabled = false;
        });

        // Convert an AudioBuffer into a 16-bit PCM WAV file.
        function audioBufferToWav(buffer) {
            const numberOfChannels = buffer.numberOfChannels;
            const sampleRate = buffer.sampleRate;
            const format = 1;
            const bitDepth = 16;
            const channelData = [];

            for (let channel = 0; channel < numberOfChannels; channel++) {
                channelData.push(buffer.getChannelData(channel));
            }

            const length = buffer.length * numberOfChannels * 2;
            const arrayBuffer = new ArrayBuffer(44 + length);
            const view = new DataView(arrayBuffer);

            // RIFF header.
            writeString(view, 0, "RIFF");
            view.setUint32(4, 36 + length, true);
            writeString(view, 8, "WAVE");
            writeString(view, 12, "fmt ");
            view.setUint32(16, 16, true);
            view.setUint16(20, format, true);
            view.setUint16(22, numberOfChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(
                28,
                sampleRate * numberOfChannels * 2,
                true
            );
            view.setUint16(32, numberOfChannels * 2, true);
            view.setUint16(34, bitDepth, true);
            writeString(view, 36, "data");
            view.setUint32(40, length, true);

            // Interleave the audio samples.
            let offset = 44;

            for (let i = 0; i < buffer.length; i++) {
                for (
                    let channel = 0;
                    channel < numberOfChannels;
                    channel++
                ) {
                    let sample = channelData[channel][i];
                    sample = Math.max(-1, Math.min(1, sample));

                    const value = sample < 0
                        ? sample * 0x8000
                        : sample * 0x7fff;

                    view.setInt16(offset, value, true);
                    offset += 2;
                }
            }

            return new Blob([arrayBuffer], { type: "audio/wav" });
        }

        // Write an ASCII string into the WAV header.
        function writeString(view, offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        }
    </script>
</body>
</html>
