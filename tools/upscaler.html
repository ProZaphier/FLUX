<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FLUX Upscaler</title>

    <!-- ONNX Runtime WebGPU -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.webgpu.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background:
                radial-gradient(circle at top, rgba(0, 120, 255, 0.12), transparent 40%),
                #050912;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
        }

        .navbar {
            width: 100%;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            background: rgba(5, 9, 18, 0.92);
            backdrop-filter: blur(14px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-inner {
            max-width: 1200px;
            margin: auto;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .logo {
            color: #ffffff;
            text-decoration: none;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 3px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: #aab4c7;
            text-decoration: none;
            padding: 9px 13px;
            border-radius: 8px;
            font-size: 14px;
            transition: 0.2s ease;
        }

        .nav-links a:hover {
            color: #ffffff;
            background: rgba(255,255,255,0.07);
        }

        .nav-links a.active {
            color: #ffffff;
            background: rgba(40, 130, 255, 0.16);
        }

        .container {
            width: min(900px, calc(100% - 32px));
            margin: 0 auto;
            padding: 60px 0 80px;
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header h1 {
            margin: 0 0 10px;
            font-size: clamp(32px, 6vw, 54px);
            letter-spacing: 5px;
        }

        .header p {
            margin: 0;
            color: #8792a7;
            font-size: 15px;
        }

        .drop-zone {
            border: 1px dashed rgba(255,255,255,0.22);
            border-radius: 18px;
            padding: 70px 30px;
            text-align: center;
            background: rgba(255,255,255,0.025);
            cursor: pointer;
            transition: 0.2s ease;
        }

        .drop-zone:hover,
        .drop-zone.dragging {
            border-color: #398cff;
            background: rgba(40,130,255,0.07);
        }

        .drop-zone h2 {
            margin: 0 0 10px;
            font-size: 20px;
        }

        .drop-zone p {
            color: #7e899d;
            margin: 0;
        }

        #fileInput {
            display: none;
        }

        .preview-wrapper {
            display: none;
            margin-top: 25px;
            text-align: center;
        }

        .preview-wrapper img {
            max-width: 100%;
            max-height: 600px;
            border-radius: 14px;
            display: block;
            margin: auto;
            box-shadow: 0 15px 50px rgba(0,0,0,0.4);
        }

        .image-info {
            margin-top: 12px;
            color: #7f8a9e;
            font-size: 13px;
        }

        .controls {
            display: none;
            margin-top: 25px;
            padding: 20px;
            border-radius: 15px;
            background: rgba(255,255,255,0.035);
            border: 1px solid rgba(255,255,255,0.07);
        }

        .control-row {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button,
        .download-button {
            border: 0;
            border-radius: 9px;
            padding: 12px 18px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: 0.2s ease;
        }

        .scale-button {
            background: rgba(255,255,255,0.08);
            color: #ffffff;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .scale-button:hover {
            background: rgba(255,255,255,0.14);
        }

        .scale-button.selected {
            background: #247cff;
            border-color: #247cff;
        }

        .upscale-button {
            background: #ffffff;
            color: #050912;
        }

        .upscale-button:hover {
            transform: translateY(-1px);
        }

        .upscale-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .change-button {
            background: transparent;
            color: #9ba6b9;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .change-button:hover {
            color: #ffffff;
            border-color: rgba(255,255,255,0.25);
        }

        .status {
            min-height: 22px;
            margin-top: 20px;
            text-align: center;
            color: #8e9ab0;
            font-size: 14px;
            line-height: 1.5;
        }

        .status.error {
            color: #ff7d7d;
        }

        .status.success {
            color: #8de0ae;
        }

        .download-wrapper {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .download-button {
            display: inline-block;
            background: #247cff;
            color: white;
        }

        .download-button:hover {
            background: #3c8cff;
        }

        @media (max-width: 650px) {
            .nav-inner {
                align-items: flex-start;
                flex-direction: column;
            }

            .nav-links {
                width: 100%;
            }

            .nav-links a {
                padding: 8px 9px;
                font-size: 13px;
            }

            .container {
                padding-top: 40px;
            }

            .drop-zone {
                padding: 55px 20px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="nav-inner">

            <a class="logo" href="../index.html">
                FLUX
            </a>

            <div class="nav-links">

                <a href="../index.html">
                    Home
                </a>

                <a href="../index.html#tools">
                    Tools
                </a>

                <a href="audio-extractor.html">
                    Audio Extractor
                </a>

                <a href="upscaler.html" class="active">
                    Upscaler
                </a>

            </div>

        </div>
    </nav>


    <main class="container">

        <div class="header">

            <h1>FLUX UPSCALER</h1>

            <p>
                AI image upscaling, directly in your browser.
            </p>

        </div>


        <div class="drop-zone" id="dropZone">

            <h2>
                Drop an image here
            </h2>

            <p>
                or click to browse
            </p>

            <input
                type="file"
                id="fileInput"
                accept="image/*,.jfif"
            >

        </div>


        <div class="preview-wrapper" id="previewWrapper">

            <img
                id="preview"
                alt="Selected image preview"
            >

            <div class="image-info" id="imageInfo"></div>

        </div>


        <div class="controls" id="controls">

            <div class="control-row">

                <button
                    class="scale-button selected"
                    id="scale2"
                    type="button"
                >
                    2×
                </button>

                <button
                    class="scale-button"
                    id="scale4"
                    type="button"
                >
                    4×
                </button>

                <button
                    class="upscale-button"
                    id="upscaleButton"
                    type="button"
                >
                    Upscale Image
                </button>

                <button
                    class="change-button"
                    id="changeImageButton"
                    type="button"
                >
                    Change Image
                </button>

            </div>

        </div>


        <div
            class="status"
            id="status"
        ></div>


        <div
            class="download-wrapper"
            id="downloadWrapper"
        >

            <a
                class="download-button"
                id="downloadButton"
                download="flux-upscaled.png"
            >
                Download Upscaled Image
            </a>

        </div>

    </main>


    <script>

        /* ==========================================
           FLUX AI UPSCALER
        ========================================== */

        const MODEL_URL =
            "https://huggingface.co/skillsafe-ai/realesrgan-x2plus/resolve/main/model.onnx";


        /* ==========================================
           ELEMENTS
        ========================================== */

        const dropZone =
            document.getElementById("dropZone");

        const fileInput =
            document.getElementById("fileInput");

        const previewWrapper =
            document.getElementById("previewWrapper");

        const preview =
            document.getElementById("preview");

        const imageInfo =
            document.getElementById("imageInfo");

        const controls =
            document.getElementById("controls");

        const status =
            document.getElementById("status");

        const scale2 =
            document.getElementById("scale2");

        const scale4 =
            document.getElementById("scale4");

        const upscaleButton =
            document.getElementById("upscaleButton");

        const changeImageButton =
            document.getElementById("changeImageButton");

        const downloadWrapper =
            document.getElementById("downloadWrapper");

        const downloadButton =
            document.getElementById("downloadButton");


        /* ==========================================
           STATE
        ========================================== */

        let selectedFile = null;

        let selectedScale = 2;

        let session = null;

        let originalWidth = 0;

        let originalHeight = 0;

        let selectedObjectURL = null;

        let downloadObjectURL = null;

        let usingWebGPU = false;


        /* ==========================================
           STATUS
        ========================================== */

        function setStatus(message, type = "") {

            status.textContent = message;

            status.className = "status";

            if (type) {
                status.classList.add(type);
            }

        }


        /* ==========================================
           SMALL BROWSER YIELD
           Keeps the page responsive while doing
           large pixel conversions.
        ========================================== */

        function yieldToBrowser() {

            return new Promise(resolve => {

                requestAnimationFrame(() => {
                    resolve();
                });

            });

        }


        /* ==========================================
           FILE INPUT
        ========================================== */

        dropZone.addEventListener("click", () => {

            fileInput.click();

        });


        fileInput.addEventListener("change", (event) => {

            const file =
                event.target.files[0];

            if (file) {
                loadImage(file);
            }

        });


        /* ==========================================
           DRAG AND DROP
        ========================================== */

        dropZone.addEventListener("dragover", (event) => {

            event.preventDefault();

            dropZone.classList.add("dragging");

        });


        dropZone.addEventListener("dragleave", () => {

            dropZone.classList.remove("dragging");

        });


        dropZone.addEventListener("drop", (event) => {

            event.preventDefault();

            dropZone.classList.remove("dragging");

            const file =
                event.dataTransfer.files[0];

            if (!file) {
                return;
            }

            if (
                !file.type.startsWith("image/") &&
                !file.name.toLowerCase().endsWith(".jfif")
            ) {

                setStatus(
                    "Please select a valid image file.",
                    "error"
                );

                return;

            }

            loadImage(file);

        });


        /* ==========================================
           LOAD IMAGE
        ========================================== */

        function loadImage(file) {

            selectedFile = file;

            downloadWrapper.style.display = "none";

            if (downloadObjectURL) {

                URL.revokeObjectURL(
                    downloadObjectURL
                );

                downloadObjectURL = null;

            }

            setStatus("Loading image...");


            if (selectedObjectURL) {

                URL.revokeObjectURL(
                    selectedObjectURL
                );

                selectedObjectURL = null;

            }


            selectedObjectURL =
                URL.createObjectURL(file);


            const image =
                new Image();


            image.onload = () => {

                originalWidth =
                    image.naturalWidth;

                originalHeight =
                    image.naturalHeight;


                preview.src =
                    selectedObjectURL;


                previewWrapper.style.display =
                    "block";


                controls.style.display =
                    "block";


                dropZone.style.display =
                    "none";


                imageInfo.textContent =
                    `${originalWidth} × ${originalHeight}px`;


                setStatus(
                    "Image ready. Choose a scale and upscale."
                );

            };


            image.onerror = () => {

                if (selectedObjectURL) {

                    URL.revokeObjectURL(
                        selectedObjectURL
                    );

                    selectedObjectURL = null;

                }

                setStatus(
                    "This image could not be read by the browser.",
                    "error"
                );

            };


            image.src =
                selectedObjectURL;

        }


        /* ==========================================
           CHANGE IMAGE
        ========================================== */

        changeImageButton.addEventListener("click", () => {

            fileInput.value = "";

            fileInput.click();

        });


        /* ==========================================
           SCALE BUTTONS
        ========================================== */

        scale2.addEventListener("click", () => {

            selectedScale = 2;

            scale2.classList.add("selected");

            scale4.classList.remove("selected");

        });


        scale4.addEventListener("click", () => {

            selectedScale = 4;

            scale4.classList.add("selected");

            scale2.classList.remove("selected");

        });


        /* ==========================================
           LOAD AI MODEL
        ========================================== */

        async function loadModel() {

            if (session) {
                return session;
            }


            /*
             * Prefer WebGPU.
             */

            if ("gpu" in navigator) {

                try {

                    setStatus(
                        "Starting GPU acceleration..."
                    );


                    const startTime =
                        performance.now();


                    session =
                        await ort.InferenceSession.create(
                            MODEL_URL,
                            {
                                executionProviders: [
                                    "webgpu"
                                ],
                                graphOptimizationLevel:
                                    "all"
                            }
                        );


                    usingWebGPU = true;


                    console.log(
                        `FLUX WebGPU model loaded in ${(
                            performance.now() -
                            startTime
                        ).toFixed(0)} ms`
                    );


                    setStatus(
                        "GPU acceleration enabled."
                    );


                    return session;

                } catch (webgpuError) {

                    console.warn(
                        "WebGPU unavailable. Falling back to WASM.",
                        webgpuError
                    );

                    session = null;

                }

            }


            /*
             * CPU fallback.
             */

            try {

                setStatus(
                    "GPU unavailable. Loading CPU fallback..."
                );


                const startTime =
                    performance.now();


                session =
                    await ort.InferenceSession.create(
                        MODEL_URL,
                        {
                            executionProviders: [
                                "wasm"
                            ],
                            graphOptimizationLevel:
                                "all"
                        }
                    );


                usingWebGPU = false;


                console.log(
                    `FLUX WASM model loaded in ${(
                        performance.now() -
                        startTime
                    ).toFixed(0)} ms`
                );


                setStatus(
                    "CPU fallback enabled."
                );


                return session;

            } catch (error) {

                console.error(
                    "Model loading error:",
                    error
                );


                throw new Error(
                    "Could not load the AI model: " +
                    error.message
                );

            }

        }


        /* ==========================================
           IMAGE → TENSOR
           
           This version intentionally does NOT tile
           normal images. A 1000×1000 image is only
           1 megapixel and should be handled as one
           inference on a capable GPU.
        ========================================== */

        async function imageToTensor(imageSource) {

            const startTime =
                performance.now();


            /*
             * Decode image.
             */

            setStatus(
                "Preparing image: decoding..."
            );


            const image =
                new Image();


            image.decoding = "async";


            const loadedImage =
                await new Promise((resolve, reject) => {

                    image.onload = () => resolve(image);

                    image.onerror = () => reject(
                        new Error(
                            "The selected image could not be decoded."
                        )
                    );

                    image.src = imageSource;

                });


            let width =
                loadedImage.naturalWidth;

            let height =
                loadedImage.naturalHeight;


            const megapixels =
                (
                    width *
                    height
                ) / 1000000;


            if (megapixels > 20) {

                throw new Error(
                    "This image is too large for browser upscaling. Please use an image below 20 megapixels."
                );

            }


            /*
             * The model needs even dimensions.
             */

            const paddedWidth =
                width % 2 === 0
                    ? width
                    : width + 1;


            const paddedHeight =
                height % 2 === 0
                    ? height
                    : height + 1;


            setStatus(
                `Preparing image: ${paddedWidth} × ${paddedHeight}px...`
            );


            /*
             * Canvas.
             */

            const canvas =
                document.createElement(
                    "canvas"
                );


            canvas.width =
                paddedWidth;

            canvas.height =
                paddedHeight;


            const ctx =
                canvas.getContext(
                    "2d",
                    {
                        willReadFrequently: true
                    }
                );


            if (!ctx) {

                throw new Error(
                    "The browser could not create a canvas context."
                );

            }


            /*
             * Draw original image.
             */

            ctx.drawImage(
                loadedImage,
                0,
                0,
                width,
                height
            );


            /*
             * If dimensions are odd, duplicate the
             * final column and/or row.
             */

            if (paddedWidth !== width) {

                ctx.drawImage(
                    canvas,
                    width - 1,
                    0,
                    1,
                    height,
                    width,
                    0,
                    1,
                    height
                );

            }


            if (paddedHeight !== height) {

                ctx.drawImage(
                    canvas,
                    0,
                    height - 1,
                    paddedWidth,
                    1,
                    0,
                    height,
                    paddedWidth,
                    1
                );

            }


            await yieldToBrowser();


            /*
             * Read pixels.
             */

            setStatus(
                "Preparing image: reading pixels..."
            );


            const imageData =
                ctx.getImageData(
                    0,
                    0,
                    paddedWidth,
                    paddedHeight
                );


            const pixelCount =
                paddedWidth *
                paddedHeight;


            /*
             * Float32 planar RGB tensor.
             *
             * [1, 3, H, W]
             */

            const tensorData =
                new Float32Array(
                    pixelCount * 3
                );


            const redOffset =
                0;

            const greenOffset =
                pixelCount;

            const blueOffset =
                pixelCount * 2;


            /*
             * Process in chunks instead of one enormous
             * blocking loop. This keeps the browser
             * responsive on weaker machines.
             */

            const CHUNK_PIXELS =
                250000;


            for (
                let start = 0;
                start < pixelCount;
                start += CHUNK_PIXELS
            ) {

                const end =
                    Math.min(
                        start + CHUNK_PIXELS,
                        pixelCount
                    );


                for (
                    let i = start;
                    i < end;
                    i++
                ) {

                    const p =
                        i * 4;


                    tensorData[
                        redOffset + i
                    ] =
                        imageData.data[p] / 255;


                    tensorData[
                        greenOffset + i
                    ] =
                        imageData.data[p + 1] / 255;


                    tensorData[
                        blueOffset + i
                    ] =
                        imageData.data[p + 2] / 255;

                }


                const percent =
                    Math.round(
                        (end / pixelCount) * 100
                    );


                setStatus(
                    `Preparing image: ${percent}%...`
                );


                await yieldToBrowser();

            }


            const tensor =
                new ort.Tensor(
                    "float32",
                    tensorData,
                    [
                        1,
                        3,
                        paddedHeight,
                        paddedWidth
                    ]
                );


            /*
             * The canvas and ImageData are no longer
             * needed after the tensor is created.
             */

            canvas.width = 1;
            canvas.height = 1;


            console.log(
                `Tensor preparation: ${(
                    performance.now() -
                    startTime
                ).toFixed(0)} ms`
            );


            return {

                tensor,

                originalWidth:
                    width,

                originalHeight:
                    height,

                paddedWidth,

                paddedHeight

            };

        }


        /* ==========================================
           TENSOR → CANVAS
        ========================================== */

        async function tensorToCanvas(
            outputTensor,
            originalWidth,
            originalHeight
        ) {

            const startTime =
                performance.now();


            const dims =
                outputTensor.dims;

            const data =
                outputTensor.data;


            const outputHeight =
                dims[2];

            const outputWidth =
                dims[3];


            /*
             * Because the model is 2×, the output
             * dimensions are twice the original.
             *
             * Crop any padding from the odd input.
             */

            const finalWidth =
                originalWidth * 2;

            const finalHeight =
                originalHeight * 2;


            const canvas =
                document.createElement(
                    "canvas"
                );


            canvas.width =
                finalWidth;

            canvas.height =
                finalHeight;


            const ctx =
                canvas.getContext("2d");


            if (!ctx) {

                throw new Error(
                    "Could not create output canvas."
                );

            }


            const imageData =
                ctx.createImageData(
                    finalWidth,
                    finalHeight
                );


            const planeSize =
                outputWidth *
                outputHeight;


            const redOffset =
                0;

            const greenOffset =
                planeSize;

            const blueOffset =
                planeSize * 2;


            const totalPixels =
                finalWidth *
                finalHeight;


            const CHUNK_PIXELS =
                250000;


            for (
                let start = 0;
                start < totalPixels;
                start += CHUNK_PIXELS
            ) {

                const end =
                    Math.min(
                        start + CHUNK_PIXELS,
                        totalPixels
                    );


                for (
                    let i = start;
                    i < end;
                    i++
                ) {

                    const y =
                        Math.floor(
                            i / finalWidth
                        );

                    const x =
                        i -
                        (
                            y *
                            finalWidth
                        );


                    const sourceIndex =
                        y *
                        outputWidth +
                        x;


                    const targetIndex =
                        i * 4;


                    imageData.data[
                        targetIndex
                    ] =
                        Math.max(
                            0,
                            Math.min(
                                255,
                                Math.round(
                                    data[
                                        redOffset +
                                        sourceIndex
                                    ] * 255
                                )
                            )
                        );


                    imageData.data[
                        targetIndex + 1
                    ] =
                        Math.max(
                            0,
                            Math.min(
                                255,
                                Math.round(
                                    data[
                                        greenOffset +
                                        sourceIndex
                                    ] * 255
                                )
                            )
                        );


                    imageData.data[
                        targetIndex + 2
                    ] =
                        Math.max(
                            0,
                            Math.min(
                                255,
                                Math.round(
                                    data[
                                        blueOffset +
                                        sourceIndex
                                    ] * 255
                                )
                            )
                        );


                    imageData.data[
                        targetIndex + 3
                    ] = 255;

                }


                const percent =
                    Math.round(
                        (end / totalPixels) * 100
                    );


                setStatus(
                    `Preparing result: ${percent}%...`
                );


                await yieldToBrowser();

            }


            ctx.putImageData(
                imageData,
                0,
                0
            );


            console.log(
                `Output conversion: ${(
                    performance.now() -
                    startTime
                ).toFixed(0)} ms`
            );


            return canvas;

        }


        /* ==========================================
           CANVAS → BLOB URL
           
           Much cheaper than toDataURL().
        ========================================== */

        async function canvasToObjectURL(canvas) {

            const blob =
                await new Promise(
                    (resolve, reject) => {

                        canvas.toBlob(
                            result => {

                                if (result) {
                                    resolve(result);
                                } else {
                                    reject(
                                        new Error(
                                            "Could not encode the output image."
                                        )
                                    );
                                }

                            },
                            "image/png"
                        );

                    }
                );


            return URL.createObjectURL(blob);

        }


        /* ==========================================
           ONE 2× PASS
        ========================================== */

        async function upscale2x(
            imageSource
        ) {

            const ai =
                await loadModel();


            setStatus(
                "Preparing image..."
            );


            const prepared =
                await imageToTensor(
                    imageSource
                );


            setStatus(
                `Running AI on ${prepared.paddedWidth} × ${prepared.paddedHeight}px using ${usingWebGPU ? "GPU" : "CPU"}...`
            );


            const inferenceStart =
                performance.now();


            let results;


            try {

                results =
                    await ai.run({
                        input:
                            prepared.tensor
                    });

            } catch (error) {

                console.error(
                    "ONNX inference error:",
                    error
                );

                throw new Error(
                    "AI inference failed: " +
                    (
                        error.message ||
                        "Unknown error"
                    )
                );

            }


            console.log(
                `AI inference: ${(
                    performance.now() -
                    inferenceStart
                ).toFixed(0)} ms`
            );


            const output =
                results.output;


            if (!output) {

                throw new Error(
                    "The AI model returned no output."
                );

            }


            setStatus(
                "Converting AI result..."
            );


            const resultCanvas =
                await tensorToCanvas(
                    output,
                    prepared.originalWidth,
                    prepared.originalHeight
                );


            /*
             * Help release references to the large
             * intermediate tensor data.
             */

            prepared.tensor =
                null;

            results =
                null;


            return resultCanvas;

        }


        /* ==========================================
           UPSCALE BUTTON
        ========================================== */

        upscaleButton.addEventListener(
            "click",
            async () => {

                if (
                    !selectedFile ||
                    !selectedObjectURL
                ) {

                    setStatus(
                        "Please select an image first.",
                        "error"
                    );

                    return;

                }


                upscaleButton.disabled =
                    true;


                scale2.disabled =
                    true;

                scale4.disabled =
                    true;

                changeImageButton.disabled =
                    true;


                downloadWrapper.style.display =
                    "none";


                if (downloadObjectURL) {

                    URL.revokeObjectURL(
                        downloadObjectURL
                    );

                    downloadObjectURL = null;

                }


                try {

                    let resultCanvas;


                    /*
                     * 2×
                     */

                    if (
                        selectedScale === 2
                    ) {

                        resultCanvas =
                            await upscale2x(
                                selectedObjectURL
                            );

                    }


                    /*
                     * 4×
                     *
                     * Two separate 2× passes.
                     */

                    else {

                        setStatus(
                            "Running first 2× AI pass..."
                        );


                        const firstPass =
                            await upscale2x(
                                selectedObjectURL
                            );


                        setStatus(
                            "Preparing second 2× pass..."
                        );


                        /*
                         * Convert the first pass to a
                         * Blob rather than a massive
                         * base64 data URL.
                         */

                        const firstPassBlob =
                            await new Promise(
                                (resolve, reject) => {

                                    firstPass.toBlob(
                                        blob => {

                                            if (blob) {
                                                resolve(blob);
                                            } else {
                                                reject(
                                                    new Error(
                                                        "Could not prepare the first upscale pass."
                                                    )
                                                );
                                            }

                                        },
                                        "image/png"
                                    );

                                }
                            );


                        const firstPassURL =
                            URL.createObjectURL(
                                firstPassBlob
                            );


                        try {

                            setStatus(
                                "Running second 2× AI pass..."
                            );


                            resultCanvas =
                                await upscale2x(
                                    firstPassURL
                                );

                        } finally {

                            URL.revokeObjectURL(
                                firstPassURL
                            );

                        }


                        /*
                         * Release first-pass canvas.
                         */

                        firstPass.width = 1;
                        firstPass.height = 1;

                    }


                    /*
                     * Create final downloadable
                     * Blob URL.
                     */

                    setStatus(
                        "Encoding final image..."
                    );


                    downloadObjectURL =
                        await canvasToObjectURL(
                            resultCanvas
                        );


                    /*
                     * Show result.
                     */

                    preview.src =
                        downloadObjectURL;


                    imageInfo.textContent =
                        `${resultCanvas.width} × ${resultCanvas.height}px`;


                    downloadButton.href =
                        downloadObjectURL;


                    downloadButton.download =
                        selectedScale === 2
                            ? "flux-upscaled-2x.png"
                            : "flux-upscaled-4x.png";


                    downloadWrapper.style.display =
                        "block";


                    setStatus(
                        `Upscaling complete: ${resultCanvas.width} × ${resultCanvas.height}px`,
                        "success"
                    );


                    /*
                     * Release canvas memory.
                     */

                    resultCanvas.width = 1;
                    resultCanvas.height = 1;


                } catch (error) {

                    console.error(
                        "FLUX Upscaler error:",
                        error
                    );


                    setStatus(
                        "Upscaling failed: " +
                        (
                            error.message ||
                            "Unknown error"
                        ),
                        "error"
                    );

                } finally {

                    upscaleButton.disabled =
                        false;

                    scale2.disabled =
                        false;

                    scale4.disabled =
                        false;

                    changeImageButton.disabled =
                        false;

                }

            }
        );


        /* ==========================================
           CLEANUP
        ========================================== */

        window.addEventListener(
            "beforeunload",
            () => {

                if (selectedObjectURL) {

                    URL.revokeObjectURL(
                        selectedObjectURL
                    );

                }


                if (downloadObjectURL) {

                    URL.revokeObjectURL(
                        downloadObjectURL
                    );

                }

            }
        );

    </script>

</body>
</html>
