<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FLUX Upscaler</title>

    <!-- ONNX Runtime Web -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>


    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            font-family: Arial, sans-serif;

            background: #070b14;

            color: white;

            display: flex;

            justify-content: center;

            align-items: center;

        }


        .container {

            width: min(900px, 92%);

            text-align: center;

        }


        h1 {

            font-size: 42px;

            margin-bottom: 8px;

            color: #5dbbff;

        }


        .subtitle {

            color: #8893a8;

            margin-bottom: 35px;

        }


        /* =========================
           UPLOAD
        ========================= */

        .upload-box {

            border: 2px dashed #315273;

            border-radius: 18px;

            padding: 60px 20px;

            background: #0c1321;

            cursor: pointer;

            transition:
                border-color 0.2s,
                background 0.2s,
                transform 0.2s;

        }


        .upload-box:hover {

            border-color: #5dbbff;

            background: #101a2b;

            transform: translateY(-2px);

        }


        .upload-box.dragging {

            border-color: #5dbbff;

            background: #14243b;

            transform: scale(1.01);

        }


        input[type="file"] {

            display: none;

        }


        .upload-title {

            font-size: 22px;

            margin-bottom: 10px;

            pointer-events: none;

        }


        .upload-info {

            color: #78859a;

            pointer-events: none;

        }


        /* =========================
           CONTROLS
        ========================= */

        .controls {

            margin-top: 25px;

            display: none;

            gap: 12px;

            justify-content: center;

            flex-wrap: wrap;

        }


        button {

            border: none;

            border-radius: 10px;

            padding: 13px 22px;

            background: #16263c;

            color: white;

            cursor: pointer;

            font-size: 15px;

            transition:
                background 0.2s,
                transform 0.2s;

        }


        button:hover {

            background: #21415f;

            transform: translateY(-1px);

        }


        button.active {

            background: #298bd1;

        }


        #upscaleBtn {

            background: #298bd1;

        }


        #upscaleBtn:hover {

            background: #3aa0ec;

        }


        #upscaleBtn:disabled {

            opacity: 0.5;

            cursor: not-allowed;

            transform: none;

        }


        /* =========================
           PREVIEW
        ========================= */

        .preview {

            margin-top: 30px;

            display: none;

        }


        .preview img {

            max-width: 100%;

            max-height: 500px;

            border-radius: 12px;

            border: 1px solid #25354b;

            display: block;

            margin: auto;

        }


        .filename {

            margin-top: 12px;

            color: #9ba8bc;

        }


        /* =========================
           STATUS
        ========================= */

        .status {

            margin-top: 25px;

            color: #65c4ff;

            min-height: 24px;

        }


        /* =========================
           DOWNLOAD
        ========================= */

        #downloadBtn {

            display: none;

            margin-top: 20px;

            background: #1d9b68;

            color: white;

            text-decoration: none;

            padding: 13px 22px;

            border-radius: 10px;

            font-size: 15px;

        }


        #downloadBtn:hover {

            background: #25b77b;

        }

    </style>

</head>


<body>


<div class="container">


    <h1>FLUX UPSCALER</h1>


    <div class="subtitle">

        AI image upscaling, directly in your browser.

    </div>


    <!-- =========================
         UPLOAD
    ========================= -->

    <div
        class="upload-box"
        id="dropZone"
    >

        <input
            type="file"
            id="fileInput"
            accept="image/png,image/jpeg,image/webp"
        >

        <div class="upload-title">
            Drop an image here
        </div>

        <div class="upload-info">
            or click to browse
        </div>

    </div>


    <!-- =========================
         CONTROLS
    ========================= -->

    <div
        class="controls"
        id="controls"
    >

        <button
            class="scale active"
            data-scale="2"
            type="button"
        >
            2×
        </button>


        <button
            class="scale"
            data-scale="4"
            type="button"
        >
            4×
        </button>


        <button
            id="upscaleBtn"
            type="button"
        >
            Upscale Image
        </button>

    </div>


    <!-- =========================
         PREVIEW
    ========================= -->

    <div
        class="preview"
        id="preview"
    >

        <img
            id="previewImage"
            alt="Selected image preview"
        >

        <div
            class="filename"
            id="filename"
        ></div>

    </div>


    <!-- =========================
         STATUS
    ========================= -->

    <div
        class="status"
        id="status"
    ></div>


    <!-- =========================
         DOWNLOAD
    ========================= -->

    <a
        id="downloadBtn"
        download="flux-upscaled.png"
    >
        Download Upscaled Image
    </a>


</div>



<script>


/* ============================================================
   CONFIGURATION
============================================================ */


/*
    Browser-ready Real-ESRGAN x2plus model.

    This model accepts:

        [1, 3, height, width]

    RGB float32 pixels from 0 → 1

    and returns:

        [1, 3, height*2, width*2]
*/


const MODEL_URL =
    "https://huggingface.co/skillsafe-ai/realesrgan-x2plus/resolve/main/model.onnx";


/*
    We keep the model session in memory.

    The first upscale will therefore take longer because
    the browser has to download and initialise the model.

    Subsequent images can reuse it.
*/


let session = null;


/* ============================================================
   ELEMENTS
============================================================ */


const fileInput =
    document.getElementById("fileInput");


const dropZone =
    document.getElementById("dropZone");


const preview =
    document.getElementById("preview");


const previewImage =
    document.getElementById("previewImage");


const filename =
    document.getElementById("filename");


const controls =
    document.getElementById("controls");


const status =
    document.getElementById("status");


const upscaleBtn =
    document.getElementById("upscaleBtn");


const downloadBtn =
    document.getElementById("downloadBtn");


/* ============================================================
   STATE
============================================================ */


let selectedFile = null;

let selectedScale = 2;

let previewURL = null;


/* ============================================================
   FILE PICKER
============================================================ */


dropZone.addEventListener(
    "click",
    function () {

        fileInput.click();

    }
);


fileInput.addEventListener(
    "change",
    function () {

        if (
            this.files &&
            this.files.length > 0
        ) {

            loadImage(this.files[0]);

        }

    }
);


/* ============================================================
   DRAG AND DROP
============================================================ */


dropZone.addEventListener(
    "dragover",
    function (event) {

        event.preventDefault();

        event.stopPropagation();

        dropZone.classList.add("dragging");

    }
);


dropZone.addEventListener(
    "dragleave",
    function (event) {

        event.preventDefault();

        dropZone.classList.remove("dragging");

    }
);


dropZone.addEventListener(
    "drop",
    function (event) {

        event.preventDefault();

        event.stopPropagation();

        dropZone.classList.remove("dragging");


        const files =
            event.dataTransfer.files;


        if (
            files &&
            files.length > 0
        ) {

            loadImage(files[0]);

        }

    }
);


/* ============================================================
   LOAD IMAGE
============================================================ */


function loadImage(file) {


    if (
        !file.type ||
        ![
            "image/png",
            "image/jpeg",
            "image/webp"
        ].includes(file.type)
    ) {

        status.textContent =
            "Please select a PNG, JPEG or WebP image.";

        return;

    }


    selectedFile = file;


    if (previewURL) {

        URL.revokeObjectURL(previewURL);

    }


    previewURL =
        URL.createObjectURL(file);


    previewImage.src =
        previewURL;


    const sizeKB =
        Math.round(file.size / 1024);


    filename.textContent =
        file.name +
        " • " +
        sizeKB +
        " KB";


    preview.style.display =
        "block";


    controls.style.display =
        "flex";


    downloadBtn.style.display =
        "none";


    downloadBtn.removeAttribute("href");


    status.textContent =
        "Image loaded.";

}


/* ============================================================
   SCALE BUTTONS
============================================================ */


document
    .querySelectorAll(".scale")
    .forEach(function (button) {

        button.addEventListener(
            "click",
            function () {

                document
                    .querySelectorAll(".scale")
                    .forEach(function (btn) {

                        btn.classList.remove("active");

                    });


                this.classList.add("active");


                selectedScale =
                    Number(
                        this.dataset.scale
                    );


                status.textContent =
                    selectedScale +
                    "× scaling selected.";

            }
        );

    });


/* ============================================================
   LOAD AI MODEL
============================================================ */


async function loadModel() {


    if (session) {

        return session;

    }


    status.textContent =
        "Loading FLUX AI model...";


    upscaleBtn.disabled =
        true;


    try {


        /*
            Try WebGPU first.

            WebGPU is supported in modern Chromium browsers
            such as Chrome and Edge.

            If WebGPU isn't available, ONNX Runtime will
            fall back to WebAssembly CPU execution.
        */


        session =
            await ort.InferenceSession.create(
                MODEL_URL,
                {
                    executionProviders: [
                        "webgpu",
                        "wasm"
                    ],

                    graphOptimizationLevel:
                        "all"
                }
            );


        console.log(
            "FLUX AI model loaded.",
            session.inputNames,
            session.outputNames
        );


        status.textContent =
            "AI model ready.";


        return session;


    } catch (error) {


        console.error(error);


        session = null;


        status.textContent =
            "Failed to load the AI model.";


        throw error;

    }


}


/* ============================================================
   IMAGE → TENSOR
============================================================ */


async function imageToTensor(
    imageSource
) {


    const image =
        new Image();


    image.src =
        imageSource;


    await image.decode();


    const canvas =
        document.createElement("canvas");


    canvas.width =
        image.naturalWidth;


    canvas.height =
        image.naturalHeight;


    const context =
        canvas.getContext(
            "2d",
            {
                willReadFrequently: true
            }
        );


    context.drawImage(
        image,
        0,
        0
    );


    const imageData =
        context.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        );


    const pixels =
        imageData.data;


    const width =
        canvas.width;


    const height =
        canvas.height;


    /*
        ONNX expects:

        [1, 3, H, W]

        rather than:

        [H, W, 4]
    */


    const red =
        new Float32Array(
            width * height
        );


    const green =
        new Float32Array(
            width * height
        );


    const blue =
        new Float32Array(
            width * height
        );


    for (
        let i = 0;
        i < width * height;
        i++
    ) {

        const pixel =
            i * 4;


        red[i] =
            pixels[pixel] / 255;


        green[i] =
            pixels[pixel + 1] / 255;


        blue[i] =
            pixels[pixel + 2] / 255;

    }


    const tensorData =
        new Float32Array(
            width *
            height *
            3
        );


    const planeSize =
        width * height;


    tensorData.set(
        red,
        0
    );


    tensorData.set(
        green,
        planeSize
    );


    tensorData.set(
        blue,
        planeSize * 2
    );


    return {

        tensor:
            new ort.Tensor(
                "float32",
                tensorData,
                [
                    1,
                    3,
                    height,
                    width
                ]
            ),

        width,

        height

    };

}


/* ============================================================
   TENSOR → IMAGE
============================================================ */


function tensorToCanvas(
    outputTensor
) {


    const dims =
        outputTensor.dims;


    /*
        Expected:

        [1, 3, H, W]
    */


    const height =
        dims[2];


    const width =
        dims[3];


    const data =
        outputTensor.data;


    const canvas =
        document.createElement("canvas");


    canvas.width =
        width;


    canvas.height =
        height;


    const context =
        canvas.getContext("2d");


    const imageData =
        context.createImageData(
            width,
            height
        );


    const pixels =
        imageData.data;


    const planeSize =
        width * height;


    for (
        let i = 0;
        i < planeSize;
        i++
    ) {


        pixels[i * 4] =
            clampByte(
                data[i] * 255
            );


        pixels[i * 4 + 1] =
            clampByte(
                data[
                    planeSize + i
                ] * 255
            );


        pixels[i * 4 + 2] =
            clampByte(
                data[
                    planeSize * 2 + i
                ] * 255
            );


        pixels[i * 4 + 3] =
            255;

    }


    context.putImageData(
        imageData,
        0,
        0
    );


    return canvas;

}


/* ============================================================
   CLAMP
============================================================ */


function clampByte(value) {

    return Math.max(
        0,
        Math.min(
            255,
            Math.round(value)
        )
    );

}


/* ============================================================
   RUN ONE 2× PASS
============================================================ */


async function upscale2x(
    imageSource
) {


    const ai =
        await loadModel();


    status.textContent =
        "Preparing image...";


    const input =
        await imageToTensor(
            imageSource
        );


    status.textContent =
        "Running AI upscaling...";


    const results =
        await ai.run({

            input:
                input.tensor

        });


    const outputName =
        ai.outputNames[0];


    const output =
        results[outputName];


    return tensorToCanvas(
        output
    );

}


/* ============================================================
   UPSCALE BUTTON
============================================================ */


upscaleBtn.addEventListener(
    "click",
    async function () {


        if (!selectedFile) {

            status.textContent =
                "Please select an image first.";

            return;

        }


        try {


            upscaleBtn.disabled =
                true;


            downloadBtn.style.display =
                "none";


            /*
                Use the browser-created preview URL
                as our source image.
            */


            let resultCanvas;


            if (
                selectedScale === 2
            ) {


                resultCanvas =
                    await upscale2x(
                        previewURL
                    );


            } else {


                /*
                    4× is achieved by doing:

                    2× → 2×

                    This avoids downloading another
                    4× model.
                */


                status.textContent =
                    "Running first 2× pass...";


                const firstPass =
                    await upscale2x(
                        previewURL
                    );


                status.textContent =
                    "Running second 2× pass...";


                const firstPassURL =
                    firstPass.toDataURL(
                        "image/png"
                    );


                resultCanvas =
                    await upscale2x(
                        firstPassURL
                    );

            }


            /*
                Create downloadable PNG.
            */


            status.textContent =
                "Preparing download...";


            const resultURL =
                resultCanvas.toDataURL(
                    "image/png"
                );


            downloadBtn.href =
                resultURL;


            downloadBtn.download =
                createOutputName(
                    selectedFile.name,
                    selectedScale
                );


            downloadBtn.style.display =
                "inline-block";


            status.textContent =
                selectedScale +
                "× upscale complete.";


        } catch (error) {


            console.error(
                "Upscaling error:",
                error
            );


            status.textContent =
                "Upscaling failed. Check the browser console for details.";

        } finally {


            upscaleBtn.disabled =
                false;

        }

    }
);


/* ============================================================
   OUTPUT FILENAME
============================================================ */


function createOutputName(
    originalName,
    scale
) {


    const dot =
        originalName.lastIndexOf(".");


    const base =
        dot === -1
            ? originalName
            : originalName.substring(
                0,
                dot
            );


    return (
        base +
        "-FLUX-" +
        scale +
        "x.png"
    );

}


/* ============================================================
   CLEAN UP
============================================================ */


window.addEventListener(
    "beforeunload",
    function () {

        if (previewURL) {

            URL.revokeObjectURL(
                previewURL
            );

        }

    }
);


</script>

</body>

</html>
