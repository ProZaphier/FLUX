<script>
/* =========================================================
   FLUX UPSCALER
   Optimised WebGPU + adaptive tiled fallback
   ========================================================= */

const MODEL_URL =
    "https://huggingface.co/skillsafe-ai/realesrgan-x2plus/resolve/main/model.onnx";

let session = null;
let selectedFile = null;
let usingWebGPU = false;
let deviceProfile = null;


/* =========================================================
   DEVICE PROFILE
   ========================================================= */

function getDeviceProfile() {
    const cores = navigator.hardwareConcurrency || 4;
    const memory = navigator.deviceMemory || 4;
    const hasGPU = "gpu" in navigator;

    /*
     * Modern phones and PCs get much larger tiles.
     * Weak machines still get the safe fallback.
     */

    if (hasGPU && (cores >= 8 || memory >= 8)) {
        return {
            name: "high",
            tileSize: 768,
            fullImageLimitMP: 8
        };
    }

    if (hasGPU && (cores >= 6 || memory >= 6)) {
        return {
            name: "medium",
            tileSize: 512,
            fullImageLimitMP: 4
        };
    }

    return {
        name: "safe",
        tileSize: 384,
        fullImageLimitMP: 2
    };
}


/* =========================================================
   UI HELPERS
   ========================================================= */

function setStatus(message) {
    const status = document.getElementById("status");

    if (status) {
        status.textContent = message;
    }

    console.log("[FLUX]", message);
}


function sleepFrame() {
    return new Promise(resolve => {
        requestAnimationFrame(resolve);
    });
}


/* =========================================================
   MODEL LOADING
   ========================================================= */

async function loadModel() {

    if (session) {
        return;
    }

    deviceProfile = getDeviceProfile();

    setStatus("Initialising AI model...");

    console.log("Device profile:", deviceProfile);
    console.log("CPU cores:", navigator.hardwareConcurrency);
    console.log("Device memory:", navigator.deviceMemory);
    console.log("WebGPU available:", "gpu" in navigator);

    /*
     * Try WebGPU first.
     */

    if ("gpu" in navigator) {

        try {

            setStatus("Initialising GPU acceleration...");

            const start = performance.now();

            session = await ort.InferenceSession.create(MODEL_URL, {
                executionProviders: ["webgpu"],
                graphOptimizationLevel: "all"
            });

            usingWebGPU = true;

            console.log(
                "WebGPU model loaded in",
                ((performance.now() - start) / 1000).toFixed(2),
                "seconds"
            );

            setStatus("GPU acceleration ready.");

            return;

        } catch (error) {

            console.warn("WebGPU failed:", error);

            session = null;
            usingWebGPU = false;
        }
    }


    /*
     * WASM fallback.
     */

    setStatus("GPU unavailable. Using CPU mode...");

    const start = performance.now();

    session = await ort.InferenceSession.create(MODEL_URL, {
        executionProviders: ["wasm"],
        graphOptimizationLevel: "all"
    });

    console.log(
        "WASM model loaded in",
        ((performance.now() - start) / 1000).toFixed(2),
        "seconds"
    );

    setStatus("CPU acceleration ready.");
}


/* =========================================================
   IMAGE DECODING
   ========================================================= */

async function decodeImage(file) {

    const start = performance.now();

    const bitmap = await createImageBitmap(file);

    console.log(
        "Image decoded in",
        ((performance.now() - start) / 1000).toFixed(3),
        "seconds"
    );

    return bitmap;
}


/* =========================================================
   IMAGE → TENSOR
   ========================================================= */

function imageToTensor(source, width, height) {

    const start = performance.now();

    const canvas = document.createElement("canvas");

    canvas.width = width;
    canvas.height = height;

    const ctx = canvas.getContext("2d", {
        willReadFrequently: true
    });

    ctx.drawImage(source, 0, 0, width, height);

    const imageData = ctx.getImageData(
        0,
        0,
        width,
        height
    );

    const pixels = imageData.data;
    const pixelCount = width * height;

    /*
     * Real-ESRGAN expects:
     *
     * [1, 3, H, W]
     *
     * RGB
     * 0 → 1
     */

    const tensorData = new Float32Array(
        pixelCount * 3
    );

    const channelSize = pixelCount;

    for (let i = 0; i < pixelCount; i++) {

        const p = i * 4;

        tensorData[i] =
            pixels[p] / 255;

        tensorData[channelSize + i] =
            pixels[p + 1] / 255;

        tensorData[channelSize * 2 + i] =
            pixels[p + 2] / 255;
    }

    const tensor = new ort.Tensor(
        "float32",
        tensorData,
        [1, 3, height, width]
    );

    console.log(
        "Tensor preparation:",
        ((performance.now() - start) / 1000).toFixed(3),
        "seconds"
    );

    /*
     * Release canvas memory as soon as possible.
     */

    canvas.width = 1;
    canvas.height = 1;

    return tensor;
}


/* =========================================================
   TENSOR → CANVAS
   ========================================================= */

function tensorToCanvas(tensor) {

    const start = performance.now();

    const dims = tensor.dims;

    const height = dims[2];
    const width = dims[3];

    const data = tensor.data;

    const canvas = document.createElement("canvas");

    canvas.width = width;
    canvas.height = height;

    const ctx = canvas.getContext("2d");

    const imageData = ctx.createImageData(
        width,
        height
    );

    const pixels = imageData.data;

    const pixelCount = width * height;

    const rOffset = 0;
    const gOffset = pixelCount;
    const bOffset = pixelCount * 2;

    for (let i = 0; i < pixelCount; i++) {

        pixels[i * 4] =
            Math.max(
                0,
                Math.min(
                    255,
                    Math.round(data[rOffset + i] * 255)
                )
            );

        pixels[i * 4 + 1] =
            Math.max(
                0,
                Math.min(
                    255,
                    Math.round(data[gOffset + i] * 255)
                )
            );

        pixels[i * 4 + 2] =
            Math.max(
                0,
                Math.min(
                    255,
                    Math.round(data[bOffset + i] * 255)
                )
            );

        pixels[i * 4 + 3] = 255;
    }

    ctx.putImageData(imageData, 0, 0);

    console.log(
        "Output conversion:",
        ((performance.now() - start) / 1000).toFixed(3),
        "seconds"
    );

    return canvas;
}


/* =========================================================
   SINGLE FULL IMAGE INFERENCE
   ========================================================= */

async function upscaleFullImage(source, width, height) {

    const totalStart = performance.now();

    setStatus("Preparing image...");

    await sleepFrame();

    const tensorStart = performance.now();

    const tensor =
        imageToTensor(
            source,
            width,
            height
        );

    console.log(
        "Tensor creation:",
        ((performance.now() - tensorStart) / 1000).toFixed(3),
        "seconds"
    );


    setStatus("Running AI upscaling...");

    await sleepFrame();

    const inferenceStart = performance.now();

    const result = await session.run({
        input: tensor
    });

    const inferenceTime =
        (performance.now() - inferenceStart) / 1000;

    console.log(
        "AI inference:",
        inferenceTime.toFixed(3),
        "seconds"
    );


    setStatus("Rendering result...");

    await sleepFrame();

    const outputTensor =
        result.output;

    const canvas =
        tensorToCanvas(outputTensor);

    console.log(
        "TOTAL:",
        ((performance.now() - totalStart) / 1000).toFixed(3),
        "seconds"
    );

    setStatus(
        `Complete • AI: ${inferenceTime.toFixed(2)}s`
    );

    return canvas;
}


/* =========================================================
   TILE INFERENCE
   ========================================================= */

async function upscaleTile(
    source,
    sx,
    sy,
    sw,
    sh
) {

    const tileCanvas =
        document.createElement("canvas");

    tileCanvas.width = sw;
    tileCanvas.height = sh;

    const ctx =
        tileCanvas.getContext("2d");

    ctx.drawImage(
        source,
        sx,
        sy,
        sw,
        sh,
        0,
        0,
        sw,
        sh
    );

    const tensor =
        imageToTensor(
            tileCanvas,
            sw,
            sh
        );

    const result =
        await session.run({
            input: tensor
        });

    /*
     * Release source tile immediately.
     */

    tileCanvas.width = 1;
    tileCanvas.height = 1;

    return tensorToCanvas(
        result.output
    );
}


/* =========================================================
   TILED UPSCALING
   ========================================================= */

async function upscaleTiled(
    source,
    width,
    height
) {

    const tileSize =
        deviceProfile.tileSize;

    const outputWidth =
        width * 2;

    const outputHeight =
        height * 2;

    const outputCanvas =
        document.createElement("canvas");

    outputCanvas.width =
        outputWidth;

    outputCanvas.height =
        outputHeight;

    const outputCtx =
        outputCanvas.getContext("2d");

    const columns =
        Math.ceil(width / tileSize);

    const rows =
        Math.ceil(height / tileSize);

    const totalTiles =
        columns * rows;

    let completed = 0;

    const start =
        performance.now();

    for (let y = 0; y < height; y += tileSize) {

        for (let x = 0; x < width; x += tileSize) {

            const tileWidth =
                Math.min(
                    tileSize,
                    width - x
                );

            const tileHeight =
                Math.min(
                    tileSize,
                    height - y
                );

            completed++;

            setStatus(
                `Upscaling tile ${completed}/${totalTiles}...`
            );

            await sleepFrame();

            const tile =
                await upscaleTile(
                    source,
                    x,
                    y,
                    tileWidth,
                    tileHeight
                );

            outputCtx.drawImage(
                tile,
                x * 2,
                y * 2
            );

            /*
             * Release tile canvas.
             */

            tile.width = 1;
            tile.height = 1;

            /*
             * Let the browser breathe.
             */

            await sleepFrame();
        }
    }

    console.log(
        "Tiled upscale:",
        ((performance.now() - start) / 1000).toFixed(3),
        "seconds"
    );

    return outputCanvas;
}


/* =========================================================
   SMART 2× UPSCALE
   ========================================================= */

async function upscale2x(source, width, height) {

    const megapixels =
        (width * height) / 1000000;

    console.log(
        `Input: ${width}×${height} (${megapixels.toFixed(2)} MP)`
    );

    console.log(
        "WebGPU:",
        usingWebGPU
    );

    console.log(
        "Profile:",
        deviceProfile
    );


    /*
     * Capable devices:
     *
     * Keep smaller images as ONE inference.
     *
     * This is particularly important for phones.
     */

    if (
        usingWebGPU &&
        megapixels <= deviceProfile.fullImageLimitMP
    ) {

        console.log(
            "Using full-image WebGPU inference."
        );

        return await upscaleFullImage(
            source,
            width,
            height
        );
    }


    /*
     * Large image or weaker device.
     */

    console.log(
        `Using ${deviceProfile.tileSize}px tiles.`
    );

    return await upscaleTiled(
        source,
        width,
        height
    );
}


/* =========================================================
   MAIN UPSCALE FUNCTION
   ========================================================= */

async function performUpscale(scale = 2) {

    if (!selectedFile) {
        setStatus("Please select an image first.");
        return;
    }

    const overallStart =
        performance.now();

    try {

        /*
         * Load model.
         */

        await loadModel();


        /*
         * Decode original image.
         */

        setStatus("Decoding image...");

        const bitmap =
            await decodeImage(
                selectedFile
            );

        const width =
            bitmap.width;

        const height =
            bitmap.height;

        const megapixels =
            (width * height) / 1000000;


        /*
         * Safety check.
         */

        if (megapixels > 20) {

            bitmap.close();

            throw new Error(
                "Image is larger than the 20 MP safety limit."
            );
        }


        console.log(
            "Original dimensions:",
            width,
            "×",
            height
        );


        /*
         * 2×
         */

        if (scale === 2) {

            const output =
                await upscale2x(
                    bitmap,
                    width,
                    height
                );

            bitmap.close();

            showOutput(
                output,
                "flux-upscaled-2x.png"
            );

            console.log(
                "TOTAL UPSCALE TIME:",
                (
                    (performance.now() - overallStart) /
                    1000
                ).toFixed(3),
                "seconds"
            );

            return;
        }


        /*
         * 4×
         *
         * Run two 2× passes.
         */

        if (scale === 4) {

            setStatus("Running first 2× pass...");

            const firstPass =
                await upscale2x(
                    bitmap,
                    width,
                    height
                );

            bitmap.close();

            await sleepFrame();

            setStatus("Running second 2× pass...");

            const secondPass =
                await upscale2x(
                    firstPass,
                    firstPass.width,
                    firstPass.height
                );

            /*
             * Release first-pass canvas.
             */

            firstPass.width = 1;
            firstPass.height = 1;

            showOutput(
                secondPass,
                "flux-upscaled-4x.png"
            );

            console.log(
                "TOTAL 4× TIME:",
                (
                    (performance.now() - overallStart) /
                    1000
                ).toFixed(3),
                "seconds"
            );

            return;
        }

    } catch (error) {

        console.error(
            "FLUX UPSCALER ERROR:",
            error
        );

        setStatus(
            "Upscaling failed. Check the browser console."
        );

        alert(
            "Upscaling failed.\n\n" +
            error.message
        );
    }
}


/* =========================================================
   OUTPUT
   ========================================================= */

function showOutput(
    canvas,
    filename
) {

    const preview =
        document.getElementById("preview");

    if (preview) {

        preview.src =
            canvas.toDataURL("image/png");
    }


    const download =
        document.getElementById("download");

    if (download) {

        canvas.toBlob(
            blob => {

                if (!blob) {
                    return;
                }

                const url =
                    URL.createObjectURL(blob);

                download.href = url;
                download.download = filename;

                download.style.display =
                    "inline-block";

                download.textContent =
                    "Download Image";

            },
            "image/png"
        );
    }

    setStatus("Upscaling complete.");
}


/* =========================================================
   FILE SELECTION
   ========================================================= */

function handleFile(file) {

    if (!file) {
        return;
    }

    if (!file.type.startsWith("image/")) {

        setStatus(
            "Please select an image file."
        );

        return;
    }

    selectedFile = file;

    const preview =
        document.getElementById("preview");

    if (preview) {

        const url =
            URL.createObjectURL(file);

        preview.src = url;

        preview.onload = () => {
            URL.revokeObjectURL(url);
        };
    }

    setStatus(
        `${file.name} ready.`
    );
}


/* =========================================================
   FILE INPUT
   ========================================================= */

const fileInput =
    document.getElementById("fileInput");

if (fileInput) {

    fileInput.addEventListener(
        "change",
        event => {

            const file =
                event.target.files[0];

            handleFile(file);
        }
    );
}


/* =========================================================
   DRAG + DROP
   ========================================================= */

const dropZone =
    document.getElementById("dropZone");

if (dropZone) {

    dropZone.addEventListener(
        "dragover",
        event => {

            event.preventDefault();

            dropZone.classList.add(
                "dragging"
            );
        }
    );

    dropZone.addEventListener(
        "dragleave",
        () => {

            dropZone.classList.remove(
                "dragging"
            );
        }
    );

    dropZone.addEventListener(
        "drop",
        event => {

            event.preventDefault();

            dropZone.classList.remove(
                "dragging"
            );

            const file =
                event.dataTransfer.files[0];

            handleFile(file);
        }
    );
}


/* =========================================================
   BUTTONS
   ========================================================= */

const upscale2xButton =
    document.getElementById("upscale2x");

if (upscale2xButton) {

    upscale2xButton.addEventListener(
        "click",
        () => performUpscale(2)
    );
}


const upscale4xButton =
    document.getElementById("upscale4x");

if (upscale4xButton) {

    upscale4xButton.addEventListener(
        "click",
        () => performUpscale(4)
    );
}


/* =========================================================
   INITIAL STATE
   ========================================================= */

setStatus(
    "Select an image to begin."
);

console.log(
    "FLUX Upscaler initialised."
);
