<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FLUX Upscaler</title>

    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #070b14;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: min(900px, 92%);
            text-align: center;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 8px;
            color: #5dbbff;
        }

        .subtitle {
            color: #8893a8;
            margin-bottom: 35px;
        }

        /* =========================
           UPLOAD BOX
        ========================= */

        .upload-box {
            border: 2px dashed #315273;
            border-radius: 18px;
            padding: 60px 20px;
            background: #0c1321;

            cursor: pointer;
            transition:
                border-color 0.2s,
                background 0.2s,
                transform 0.2s;
        }

        .upload-box:hover {
            border-color: #5dbbff;
            background: #101a2b;
            transform: translateY(-2px);
        }

        .upload-box.dragging {
            border-color: #5dbbff;
            background: #14243b;
            transform: scale(1.01);
        }

        input[type="file"] {
            display: none;
        }

        .upload-title {
            font-size: 22px;
            margin-bottom: 10px;
            pointer-events: none;
        }

        .upload-info {
            color: #78859a;
            pointer-events: none;
        }

        /* =========================
           CONTROLS
        ========================= */

        .controls {
            margin-top: 25px;

            display: none;

            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            border: none;
            border-radius: 10px;

            padding: 13px 22px;

            background: #16263c;
            color: white;

            cursor: pointer;
            font-size: 15px;

            transition:
                background 0.2s,
                transform 0.2s;
        }

        button:hover {
            background: #21415f;
            transform: translateY(-1px);
        }

        button.active {
            background: #298bd1;
        }

        #upscaleBtn {
            background: #298bd1;
        }

        #upscaleBtn:hover {
            background: #3aa0ec;
        }

        #upscaleBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* =========================
           PREVIEW
        ========================= */

        .preview {
            margin-top: 30px;
            display: none;
        }

        .preview img {
            max-width: 100%;
            max-height: 500px;

            border-radius: 12px;
            border: 1px solid #25354b;

            display: block;
            margin: auto;
        }

        .filename {
            margin-top: 12px;
            color: #9ba8bc;
        }

        /* =========================
           STATUS
        ========================= */

        .status {
            margin-top: 25px;

            color: #65c4ff;

            min-height: 24px;
        }

        /* =========================
           DOWNLOAD
        ========================= */

        #downloadBtn {
            display: none;

            margin-top: 20px;

            background: #1d9b68;
            color: white;

            text-decoration: none;

            padding: 13px 22px;

            border-radius: 10px;

            font-size: 15px;

            transition: background 0.2s;
        }

        #downloadBtn:hover {
            background: #25b77b;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>FLUX UPSCALER</h1>

    <div class="subtitle">
        AI image upscaling, directly in your browser.
    </div>


    <!-- =========================
         UPLOAD AREA
    ========================== -->

    <div
        class="upload-box"
        id="dropZone"
    >

        <input
            type="file"
            id="fileInput"
            accept="image/png,image/jpeg,image/webp"
        >

        <div class="upload-title">
            Drop an image here
        </div>

        <div class="upload-info">
            or click to browse
        </div>

    </div>


    <!-- =========================
         CONTROLS
    ========================== -->

    <div
        class="controls"
        id="controls"
    >

        <button
            class="scale active"
            data-scale="2"
            type="button"
        >
            2×
        </button>

        <button
            class="scale"
            data-scale="4"
            type="button"
        >
            4×
        </button>

        <button
            id="upscaleBtn"
            type="button"
        >
            Upscale Image
        </button>

    </div>


    <!-- =========================
         PREVIEW
    ========================== -->

    <div
        class="preview"
        id="preview"
    >

        <img
            id="previewImage"
            alt="Selected image preview"
        >

        <div
            class="filename"
            id="filename"
        ></div>

    </div>


    <!-- =========================
         STATUS
    ========================== -->

    <div
        class="status"
        id="status"
    ></div>


    <!-- =========================
         DOWNLOAD
    ========================== -->

    <a
        id="downloadBtn"
        download="flux-upscaled.png"
    >
        Download Upscaled Image
    </a>

</div>


<script>

    /* =========================================================
       ELEMENTS
    ========================================================= */

    const fileInput =
        document.getElementById("fileInput");

    const dropZone =
        document.getElementById("dropZone");

    const preview =
        document.getElementById("preview");

    const previewImage =
        document.getElementById("previewImage");

    const filename =
        document.getElementById("filename");

    const controls =
        document.getElementById("controls");

    const status =
        document.getElementById("status");

    const upscaleBtn =
        document.getElementById("upscaleBtn");

    const downloadBtn =
        document.getElementById("downloadBtn");


    /* =========================================================
       STATE
    ========================================================= */

    let selectedFile = null;

    let selectedScale = 2;

    let previewURL = null;


    /* =========================================================
       OPEN FILE PICKER
    ========================================================= */

    dropZone.addEventListener(
        "click",
        function () {

            fileInput.click();

        }
    );


    /* =========================================================
       FILE PICKER
    ========================================================= */

    fileInput.addEventListener(
        "change",
        function () {

            if (
                this.files &&
                this.files.length > 0
            ) {

                loadImage(
                    this.files[0]
                );

            }

        }
    );


    /* =========================================================
       DRAG OVER
    ========================================================= */

    dropZone.addEventListener(
        "dragover",
        function (event) {

            event.preventDefault();

            event.stopPropagation();

            dropZone.classList.add(
                "dragging"
            );

        }
    );


    /* =========================================================
       DRAG LEAVE
    ========================================================= */

    dropZone.addEventListener(
        "dragleave",
        function (event) {

            event.preventDefault();

            dropZone.classList.remove(
                "dragging"
            );

        }
    );


    /* =========================================================
       DROP
    ========================================================= */

    dropZone.addEventListener(
        "drop",
        function (event) {

            event.preventDefault();

            event.stopPropagation();

            dropZone.classList.remove(
                "dragging"
            );


            const files =
                event.dataTransfer.files;


            if (
                files &&
                files.length > 0
            ) {

                loadImage(
                    files[0]
                );

            }

        }
    );


    /* =========================================================
       LOAD IMAGE
    ========================================================= */

    function loadImage(file) {

        /* Check file type */

        if (
            !file.type ||
            ![
                "image/png",
                "image/jpeg",
                "image/webp"
            ].includes(file.type)
        ) {

            status.textContent =
                "Please select a PNG, JPEG or WebP image.";

            return;

        }


        /* Store selected file */

        selectedFile = file;


        /* Remove old preview URL */

        if (previewURL) {

            URL.revokeObjectURL(
                previewURL
            );

        }


        /* Create new preview URL */

        previewURL =
            URL.createObjectURL(file);


        previewImage.src =
            previewURL;


        /* File information */

        const sizeKB =
            Math.round(
                file.size / 1024
            );


        filename.textContent =
            file.name +
            " • " +
            sizeKB +
            " KB";


        /* Show interface */

        preview.style.display =
            "block";

        controls.style.display =
            "flex";


        /* Reset download */

        downloadBtn.style.display =
            "none";

        downloadBtn.removeAttribute(
            "href"
        );


        /* Status */

        status.textContent =
            "Image loaded.";

    }


    /* =========================================================
       SCALE BUTTONS
    ========================================================= */

    document
        .querySelectorAll(".scale")
        .forEach(function (button) {

            button.addEventListener(
                "click",
                function () {

                    document
                        .querySelectorAll(".scale")
                        .forEach(function (btn) {

                            btn.classList.remove(
                                "active"
                            );

                        });


                    this.classList.add(
                        "active"
                    );


                    selectedScale =
                        Number(
                            this.dataset.scale
                        );


                    status.textContent =
                        selectedScale +
                        "× scaling selected.";

                }
            );

        });


    /* =========================================================
       UPSCALE BUTTON
    ========================================================= */

    upscaleBtn.addEventListener(
        "click",
        async function () {

            if (!selectedFile) {

                status.textContent =
                    "Please select an image first.";

                return;

            }


            /*
             * AI UPSCALER WILL BE CONNECTED HERE.
             *
             * This is intentionally left empty for now.
             *
             * Next step:
             * Load the ONNX super-resolution model,
             * process the image,
             * generate the upscaled result,
             * then place it into downloadBtn.
             */


            status.textContent =
                "AI upscaler is not connected yet.";

        }
    );


    /* =========================================================
       CLEAN UP PREVIEW URL
    ========================================================= */

    window.addEventListener(
        "beforeunload",
        function () {

            if (previewURL) {

                URL.revokeObjectURL(
                    previewURL
                );

            }

        }
    );

</script>

</body>
</html>
