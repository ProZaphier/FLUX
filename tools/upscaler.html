<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FLUX Upscaler</title>


    <!--
        ONNX Runtime WebGPU build.
        This is the correct build for WebGPU inference.
    -->

    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.webgpu.min.js"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family: Arial, sans-serif;

            background: #070b14;

            color: white;

            display: flex;

            justify-content: center;

            align-items: center;

        }


        .container {

            width: min(900px, 92%);

            text-align: center;

        }


        h1 {

            font-size: 42px;

            margin-bottom: 8px;

            color: #5dbbff;

        }


        .subtitle {

            color: #8893a8;

            margin-bottom: 35px;

        }


        /* =========================
           UPLOAD BOX
        ========================= */

        .upload-box {

            border: 2px dashed #315273;

            border-radius: 18px;

            padding: 60px 20px;

            background: #0c1321;

            cursor: pointer;

            transition:
                border-color 0.2s,
                background 0.2s,
                transform 0.2s;

        }


        .upload-box:hover {

            border-color: #5dbbff;

            background: #101a2b;

            transform: translateY(-2px);

        }


        .upload-box.dragging {

            border-color: #5dbbff;

            background: #14243b;

            transform: scale(1.01);

        }


        input[type="file"] {

            display: none;

        }


        .upload-title {

            font-size: 22px;

            margin-bottom: 10px;

            pointer-events: none;

        }


        .upload-info {

            color: #78859a;

            pointer-events: none;

        }


        /* =========================
           CHANGE IMAGE
        ========================= */

        #changeImageBtn {

            display: none;

            margin-top: 18px;

            background: #16263c;

        }


        #changeImageBtn:hover {

            background: #21415f;

        }


        /* =========================
           CONTROLS
        ========================= */

        .controls {

            margin-top: 25px;

            display: none;

            gap: 12px;

            justify-content: center;

            flex-wrap: wrap;

        }


        button {

            border: none;

            border-radius: 10px;

            padding: 13px 22px;

            background: #16263c;

            color: white;

            cursor: pointer;

            font-size: 15px;

            transition:
                background 0.2s,
                transform 0.2s;

        }


        button:hover {

            background: #21415f;

            transform: translateY(-1px);

        }


        button.active {

            background: #298bd1;

        }


        #upscaleBtn {

            background: #298bd1;

        }


        #upscaleBtn:hover {

            background: #3aa0ec;

        }


        #upscaleBtn:disabled {

            opacity: 0.5;

            cursor: not-allowed;

            transform: none;

        }


        /* =========================
           PREVIEW
        ========================= */

        .preview {

            margin-top: 30px;

            display: none;

        }


        .preview img {

            max-width: 100%;

            max-height: 500px;

            border-radius: 12px;

            border: 1px solid #25354b;

            display: block;

            margin: auto;

        }


        .filename {

            margin-top: 12px;

            color: #9ba8bc;

        }


        /* =========================
           STATUS
        ========================= */

        .status {

            margin-top: 25px;

            color: #65c4ff;

            min-height: 24px;

            line-height: 1.5;

        }


        /* =========================
           DOWNLOAD
        ========================= */

        #downloadBtn {

            display: none;

            margin-top: 20px;

            background: #1d9b68;

            color: white;

            text-decoration: none;

            padding: 13px 22px;

            border-radius: 10px;

            font-size: 15px;

        }


        #downloadBtn:hover {

            background: #25b77b;

        }

    </style>

</head>


<body>


<div class="container">


    <h1>FLUX UPSCALER</h1>


    <div class="subtitle">

        AI image upscaling, directly in your browser.

    </div>


    <!-- =========================
         FILE INPUT
    ========================= -->

    <input
        type="file"
        id="fileInput"
        accept="image/png,image/jpeg,image/webp"
    >


    <!-- =========================
         UPLOAD BOX
    ========================= -->

    <div
        class="upload-box"
        id="dropZone"
    >

        <div class="upload-title">

            Drop an image here

        </div>


        <div class="upload-info">

            or click to browse

        </div>

    </div>


    <!-- =========================
         CHANGE IMAGE
    ========================= -->

    <button
        id="changeImageBtn"
        type="button"
    >

        Change Image

    </button>


    <!-- =========================
         CONTROLS
    ========================= -->

    <div
        class="controls"
        id="controls"
    >

        <button
            class="scale active"
            data-scale="2"
            type="button"
        >

            2×

        </button>


        <button
            class="scale"
            data-scale="4"
            type="button"
        >

            4×

        </button>


        <button
            id="upscaleBtn"
            type="button"
        >

            Upscale Image

        </button>

    </div>


    <!-- =========================
         PREVIEW
    ========================= -->

    <div
        class="preview"
        id="preview"
    >

        <img
            id="previewImage"
            alt="Selected image preview"
        >


        <div
            class="filename"
            id="filename"
        ></div>

    </div>


    <!-- =========================
         STATUS
    ========================= -->

    <div
        class="status"
        id="status"
    ></div>


    <!-- =========================
         DOWNLOAD
    ========================= -->

    <a
        id="downloadBtn"
        download="flux-upscaled.png"
    >

        Download Upscaled Image

    </a>


</div>



<script>


/* ============================================================
   MODEL
============================================================ */


/*
    Real-ESRGAN x2plus

    Input:
        input
        float32
        [1, 3, H, W]

    Output:
        output
        float32
        [1, 3, H*2, W*2]
*/


const MODEL_URL =
    "https://huggingface.co/skillsafe-ai/realesrgan-x2plus/resolve/main/model.onnx";


let session = null;


/* ============================================================
   ELEMENTS
============================================================ */


const fileInput =
    document.getElementById("fileInput");


const dropZone =
    document.getElementById("dropZone");


const changeImageBtn =
    document.getElementById("changeImageBtn");


const preview =
    document.getElementById("preview");


const previewImage =
    document.getElementById("previewImage");


const filename =
    document.getElementById("filename");


const controls =
    document.getElementById("controls");


const status =
    document.getElementById("status");


const upscaleBtn =
    document.getElementById("upscaleBtn");


const downloadBtn =
    document.getElementById("downloadBtn");


/* ============================================================
   STATE
============================================================ */


let selectedFile = null;

let selectedScale = 2;

let previewURL = null;


/* ============================================================
   OPEN FILE PICKER
============================================================ */


function openFilePicker() {

    fileInput.click();

}


/* ============================================================
   UPLOAD BOX CLICK
============================================================ */


dropZone.addEventListener(
    "click",
    openFilePicker
);


/* ============================================================
   CHANGE IMAGE CLICK
============================================================ */


changeImageBtn.addEventListener(
    "click",
    openFilePicker
);


/* ============================================================
   FILE SELECTED
============================================================ */


fileInput.addEventListener(
    "change",
    function () {

        if (
            this.files &&
            this.files.length > 0
        ) {

            loadImage(
                this.files[0]
            );

        }

    }
);


/* ============================================================
   DRAG OVER
============================================================ */


dropZone.addEventListener(
    "dragover",
    function (event) {

        event.preventDefault();

        event.stopPropagation();

        dropZone.classList.add(
            "dragging"
        );

    }
);


/* ============================================================
   DRAG LEAVE
============================================================ */


dropZone.addEventListener(
    "dragleave",
    function (event) {

        event.preventDefault();

        dropZone.classList.remove(
            "dragging"
        );

    }
);


/* ============================================================
   DROP
============================================================ */


dropZone.addEventListener(
    "drop",
    function (event) {

        event.preventDefault();

        event.stopPropagation();

        dropZone.classList.remove(
            "dragging"
        );


        const files =
            event.dataTransfer.files;


        if (
            files &&
            files.length > 0
        ) {

            loadImage(
                files[0]
            );

        }

    }
);


/* ============================================================
   LOAD IMAGE
============================================================ */


function loadImage(file) {


    if (
        !file.type ||
        ![
            "image/png",
            "image/jpeg",
            "image/webp"
        ].includes(file.type)
    ) {

        status.textContent =
            "Please select a PNG, JPEG or WebP image.";

        return;

    }


    selectedFile =
        file;


    if (previewURL) {

        URL.revokeObjectURL(
            previewURL
        );

    }


    previewURL =
        URL.createObjectURL(
            file
        );


    previewImage.src =
        previewURL;


    filename.textContent =
        file.name +
        " • " +
        Math.round(
            file.size / 1024
        ) +
        " KB";


    preview.style.display =
        "block";


    controls.style.display =
        "flex";


    /*
        Hide the giant upload box.
    */

    dropZone.style.display =
        "none";


    /*
        Show a small replacement button.
    */

    changeImageBtn.style.display =
        "inline-block";


    downloadBtn.style.display =
        "none";


    downloadBtn.removeAttribute(
        "href"
    );


    status.textContent =
        "Image loaded. Ready to upscale.";

}


/* ============================================================
   SCALE BUTTONS
============================================================ */


document
    .querySelectorAll(".scale")
    .forEach(function (button) {


        button.addEventListener(
            "click",
            function () {


                document
                    .querySelectorAll(".scale")
                    .forEach(
                        function (btn) {

                            btn.classList.remove(
                                "active"
                            );

                        }
                    );


                this.classList.add(
                    "active"
                );


                selectedScale =
                    Number(
                        this.dataset.scale
                    );


                status.textContent =
                    selectedScale +
                    "× scaling selected.";

            }
        );

    });


/* ============================================================
   LOAD MODEL
============================================================ */


async function loadModel() {


    if (session) {

        return session;

    }


    status.textContent =
        "Loading FLUX AI model...";


    upscaleBtn.disabled =
        true;


    try {


        /*
            First try WebGPU.
        */


        try {

            if (
                typeof navigator !== "undefined" &&
                "gpu" in navigator
            ) {

                status.textContent =
                    "Loading AI model with WebGPU...";


                session =
                    await ort.InferenceSession.create(
                        MODEL_URL,
                        {
                            executionProviders: [
                                "webgpu"
                            ],

                            graphOptimizationLevel:
                                "all"
                        }
                    );


                status.textContent =
                    "AI model loaded using GPU.";

                return session;

            }

        } catch (gpuError) {


            console.warn(
                "WebGPU failed. Falling back to WASM.",
                gpuError
            );


            session =
                null;

        }


        /*
            CPU fallback.
        */


        status.textContent =
            "GPU unavailable. Loading CPU AI engine...";


        session =
            await ort.InferenceSession.create(
                MODEL_URL,
                {
                    executionProviders: [
                        "wasm"
                    ],

                    graphOptimizationLevel:
                        "all"
                }
            );


        status.textContent =
            "AI model loaded using CPU.";


        return session;


    } catch (error) {


        console.error(
            "MODEL LOAD ERROR:",
            error
        );


        session =
            null;


        status.textContent =
            "AI model failed to load: " +
            error.message;


        throw error;

    } finally {


        upscaleBtn.disabled =
            false;

    }

}


/* ============================================================
   IMAGE → TENSOR
============================================================ */


async function imageToTensor(
    imageSource
) {


    const image =
        new Image();


    image.src =
        imageSource;


    await image.decode();


    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        image.naturalWidth;


    canvas.height =
        image.naturalHeight;


    const context =
        canvas.getContext(
            "2d",
            {
                willReadFrequently: true
            }
        );


    context.drawImage(
        image,
        0,
        0
    );


    const imageData =
        context.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        );


    const pixels =
        imageData.data;


    const width =
        canvas.width;


    const height =
        canvas.height;


    const planeSize =
        width * height;


    const tensorData =
        new Float32Array(
            planeSize * 3
        );


    for (
        let i = 0;
        i < planeSize;
        i++
    ) {


        const pixel =
            i * 4;


        tensorData[i] =
            pixels[pixel] / 255;


        tensorData[
            planeSize + i
        ] =
            pixels[pixel + 1] / 255;


        tensorData[
            planeSize * 2 + i
        ] =
            pixels[pixel + 2] / 255;

    }


    return {

        tensor:
            new ort.Tensor(
                "float32",
                tensorData,
                [
                    1,
                    3,
                    height,
                    width
                ]
            ),

        width,

        height

    };

}


/* ============================================================
   TENSOR → CANVAS
============================================================ */


function tensorToCanvas(
    outputTensor
) {


    const dims =
        outputTensor.dims;


    const height =
        dims[2];


    const width =
        dims[3];


    const data =
        outputTensor.data;


    const planeSize =
        width * height;


    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        width;


    canvas.height =
        height;


    const context =
        canvas.getContext(
            "2d"
        );


    const imageData =
        context.createImageData(
            width,
            height
        );


    const pixels =
        imageData.data;


    for (
        let i = 0;
        i < planeSize;
        i++
    ) {


        pixels[i * 4] =
            clampByte(
                data[i] * 255
            );


        pixels[i * 4 + 1] =
            clampByte(
                data[
                    planeSize + i
                ] * 255
            );


        pixels[i * 4 + 2] =
            clampByte(
                data[
                    planeSize * 2 + i
                ] * 255
            );


        pixels[i * 4 + 3] =
            255;

    }


    context.putImageData(
        imageData,
        0,
        0
    );


    return canvas;

}


/* ============================================================
   CLAMP
============================================================ */


function clampByte(value) {

    return Math.max(
        0,
        Math.min(
            255,
            Math.round(value)
        )
    );

}


/* ============================================================
   ONE 2× PASS
============================================================ */


async function upscale2x(
    imageSource
) {


    const ai =
        await loadModel();


    status.textContent =
        "Preparing image...";


    const input =
        await imageToTensor(
            imageSource
        );


    status.textContent =
        "Running Real-ESRGAN AI...";


    /*
        The model explicitly uses:
            input → output

        according to its model contract.
    */


    const results =
        await ai.run({

            input:
                input.tensor

        });


    const output =
        results.output;


    if (!output) {

        throw new Error(
            "The AI model returned no output."
        );

    }


    return tensorToCanvas(
        output
    );

}


/* ============================================================
   UPSCALE
============================================================ */


upscaleBtn.addEventListener(
    "click",
    async function () {


        if (!selectedFile) {

            status.textContent =
                "Please select an image first.";

            return;

        }


        try {


            upscaleBtn.disabled =
                true;


            downloadBtn.style.display =
                "none";


            let resultCanvas;


            /*
                2×
            */

            if (
                selectedScale === 2
            ) {


                resultCanvas =
                    await upscale2x(
                        previewURL
                    );


            }


            /*
                4×

                2× → 2×
            */

            else {


                status.textContent =
                    "Running first 2× AI pass...";


                const firstPass =
                    await upscale2x(
                        previewURL
                    );


                status.textContent =
                    "Running second 2× AI pass...";


                const firstPassURL =
                    firstPass.toDataURL(
                        "image/png"
                    );


                resultCanvas =
                    await upscale2x(
                        firstPassURL
                    );

            }


            /*
                Convert result to PNG.
            */


            status.textContent =
                "Preparing final image...";


            const resultURL =
                resultCanvas.toDataURL(
                    "image/png"
                );


            /*
                Update preview with result.
            */


            previewImage.src =
                resultURL;


            /*
                Create download.
            */


            downloadBtn.href =
                resultURL;


            downloadBtn.download =
                createOutputName(
                    selectedFile.name,
                    selectedScale
                );


            downloadBtn.style.display =
                "inline-block";


            status.textContent =
                selectedScale +
                "× AI upscale complete.";


        } catch (error) {


            console.error(
                "FLUX UPSCALER ERROR:",
                error
            );


            /*
                Give the user the actual reason.
            */

            status.textContent =
                "Upscaling failed: " +
                (
                    error.message ||
                    String(error)
                );


        } finally {


            upscaleBtn.disabled =
                false;

        }

    }
);


/* ============================================================
   OUTPUT NAME
============================================================ */


function createOutputName(
    originalName,
    scale
) {


    const dot =
        originalName.lastIndexOf(".");


    const base =
        dot === -1
            ? originalName
            : originalName.substring(
                0,
                dot
            );


    return (
        base +
        "-FLUX-" +
        scale +
        "x.png"
    );

}


/* ============================================================
   CLEANUP
============================================================ */


window.addEventListener(
    "beforeunload",
    function () {


        if (previewURL) {

            URL.revokeObjectURL(
                previewURL
            );

        }

    }
);


</script>

</body>

</html>
