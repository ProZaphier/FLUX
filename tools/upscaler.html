<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FLUX Upscaler</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #090d14;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: min(850px, 100%);
        }

        h1 {
            text-align: center;
            margin: 0 0 8px;
            font-size: 40px;
            letter-spacing: 2px;
        }

        .subtitle {
            text-align: center;
            color: #8c98aa;
            margin-bottom: 30px;
        }

        .card {
            background: #111722;
            border: 1px solid #242d3c;
            border-radius: 18px;
            padding: 24px;
        }

        #dropZone {
            min-height: 240px;
            border: 2px dashed #3a4659;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        #dropZone:hover,
        #dropZone.dragging {
            border-color: #4d8cff;
            background: rgba(77, 140, 255, 0.06);
        }

        #dropZone h2 {
            margin-bottom: 8px;
        }

        #dropZone p {
            color: #8995a8;
            margin: 0;
        }

        #fileInput {
            display: none;
        }

        #previewWrapper {
            display: none;
            margin-top: 20px;
            text-align: center;
        }

        #preview {
            max-width: 100%;
            max-height: 500px;
            border-radius: 10px;
            display: block;
            margin: auto;
        }

        .buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        button,
        #download {
            border: 0;
            border-radius: 9px;
            padding: 13px 18px;
            font-size: 14px;
            font-weight: bold;
            color: white;
            background: #253044;
            cursor: pointer;
            text-decoration: none;
        }

        button:hover,
        #download:hover {
            background: #334159;
        }

        button.primary {
            background: #3478f6;
        }

        button.primary:hover {
            background: #2868dd;
        }

        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        #download {
            display: none;
            background: #253044;
        }

        #status {
            margin-top: 18px;
            padding: 12px;
            min-height: 42px;
            border-radius: 9px;
            background: #0b1019;
            color: #aab5c7;
            font-size: 14px;
        }

        #timing {
            margin-top: 10px;
            color: #657187;
            font-family: monospace;
            font-size: 11px;
            white-space: pre-wrap;
        }

        #progress {
            display: none;
            height: 5px;
            margin-top: 15px;
            background: #202938;
            border-radius: 99px;
            overflow: hidden;
        }

        #progressBar {
            width: 0%;
            height: 100%;
            background: #4d8cff;
            transition: width 0.15s;
        }

        .info {
            margin-top: 18px;
            font-size: 12px;
            color: #657187;
            line-height: 1.5;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .card {
                padding: 16px;
            }

            h1 {
                font-size: 32px;
            }

            .buttons {
                flex-direction: column;
            }

            button,
            #download {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>FLUX UPSCALER</h1>

    <div class="subtitle">
        AI image upscaling powered by Real-ESRGAN
    </div>

    <div class="card">

        <label id="dropZone">

            <input
                type="file"
                id="fileInput"
                accept="image/png,image/jpeg,image/webp"
            >

            <div>
                <h2>Drop an image here</h2>
                <p>or click to select an image</p>
            </div>

        </label>


        <div id="previewWrapper">

            <img
                id="preview"
                alt="Preview"
            >

        </div>


        <div class="buttons">

            <button
                id="upscale2x"
                class="primary"
                disabled
            >
                Upscale 2×
            </button>

            <button
                id="upscale4x"
                disabled
            >
                Upscale 4×
            </button>

            <button
                id="changeImage"
                disabled
            >
                Change Image
            </button>

            <a
                id="download"
                download
            >
                Download Image
            </a>

        </div>


        <div id="progress">
            <div id="progressBar"></div>
        </div>


        <div id="status">
            Loading FLUX...
        </div>


        <div id="timing"></div>


        <div class="info">
            Processing happens locally in your browser.
            Images are not uploaded to a server.
        </div>

    </div>

</div>


<!--
    IMPORTANT:
    ONNX Runtime is loaded AFTER the page itself has rendered.
-->
<script>
    window.ortReady = false;
    window.ortLoadError = null;

    const ortScript = document.createElement("script");

    ortScript.src =
        "https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.webgpu.min.js";

    ortScript.onload = () => {

        console.log(
            "[FLUX] ONNX Runtime loaded."
        );

        window.ortReady = true;

        if (typeof initialiseFLUX === "function") {
            initialiseFLUX();
        }
    };

    ortScript.onerror = () => {

        console.error(
            "[FLUX] Could not load ONNX Runtime."
        );

        window.ortLoadError =
            "Could not load ONNX Runtime.";

        const status =
            document.getElementById("status");

        status.textContent =
            "AI engine could not be loaded. Check your internet connection or browser console.";
    };

    document.body.appendChild(
        ortScript
    );
</script>


<script>

let session = null;
let selectedFile = null;
let usingWebGPU = false;
let deviceProfile = null;
let busy = false;


const fileInput =
    document.getElementById("fileInput");

const dropZone =
    document.getElementById("dropZone");

const preview =
    document.getElementById("preview");

const previewWrapper =
    document.getElementById("previewWrapper");

const status =
    document.getElementById("status");

const timing =
    document.getElementById("timing");

const progress =
    document.getElementById("progress");

const progressBar =
    document.getElementById("progressBar");

const upscale2xButton =
    document.getElementById("upscale2x");

const upscale4xButton =
    document.getElementById("upscale4x");

const changeImageButton =
    document.getElementById("changeImage");

const download =
    document.getElementById("download");


function setStatus(text) {

    status.textContent = text;

    console.log("[FLUX]", text);
}


function frame() {

    return new Promise(resolve => {

        requestAnimationFrame(resolve);

    });
}


function setProgress(value) {

    progress.style.display = "block";

    progressBar.style.width =
        value + "%";
}


/* =========================================================
   DEVICE PROFILE
   ========================================================= */

function getDeviceProfile() {

    const cores =
        navigator.hardwareConcurrency || 4;

    const memory =
        navigator.deviceMemory || 4;

    const gpu =
        "gpu" in navigator;


    if (
        gpu &&
        (
            cores >= 8 ||
            memory >= 8
        )
    ) {

        return {
            name: "high",
            tileSize: 768,
            fullImageLimitMP: 8
        };
    }


    if (
        gpu &&
        (
            cores >= 6 ||
            memory >= 6
        )
    ) {

        return {
            name: "medium",
            tileSize: 512,
            fullImageLimitMP: 4
        };
    }


    return {
        name: "safe",
        tileSize: 384,
        fullImageLimitMP: 1.5
    };
}


/* =========================================================
   MODEL
   ========================================================= */

async function loadModel() {

    if (session) {
        return;
    }


    if (!window.ortReady) {

        setStatus(
            "Waiting for AI engine..."
        );


        /*
         * Wait for ONNX Runtime to load.
         */

        for (
            let i = 0;
            i < 100;
            i++
        ) {

            if (window.ortReady) {
                break;
            }

            if (window.ortLoadError) {

                throw new Error(
                    window.ortLoadError
                );
            }

            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        100
                    )
            );
        }
    }


    if (
        !window.ortReady ||
        typeof ort === "undefined"
    ) {

        throw new Error(
            "ONNX Runtime did not load."
        );
    }


    deviceProfile =
        getDeviceProfile();


    console.log(
        "[FLUX] Device profile:",
        deviceProfile
    );


    /*
     * WebGPU first.
     */

    if ("gpu" in navigator) {

        try {

            setStatus(
                "Initialising GPU..."
            );


            session =
                await ort.InferenceSession.create(
                    "https://huggingface.co/skillsafe-ai/realesrgan-x2plus/resolve/main/model.onnx",
                    {
                        executionProviders: [
                            "webgpu"
                        ],
                        graphOptimizationLevel:
                            "all"
                    }
                );


            usingWebGPU = true;


            console.log(
                "[FLUX] WebGPU ready."
            );


            setStatus(
                "GPU acceleration ready."
            );


            return;

        } catch (error) {

            console.warn(
                "[FLUX] WebGPU failed:",
                error
            );


            session = null;
            usingWebGPU = false;
        }
    }


    /*
     * WASM fallback.
     */

    setStatus(
        "Using CPU engine..."
    );


    session =
        await ort.InferenceSession.create(
            "https://huggingface.co/skillsafe-ai/realesrgan-x2plus/resolve/main/model.onnx",
            {
                executionProviders: [
                    "wasm"
                ],
                graphOptimizationLevel:
                    "all"
            }
        );


    usingWebGPU = false;


    setStatus(
        "CPU engine ready."
    );
}


/* =========================================================
   INITIALISE
   ========================================================= */

async function initialiseFLUX() {

    console.log(
        "[FLUX] Initialising..."
    );


    setStatus(
        "AI engine loaded. Select an image."
    );
}


/* =========================================================
   FILE HANDLING
   ========================================================= */

function handleFile(file) {

    if (!file) {
        return;
    }


    if (!file.type.startsWith("image/")) {

        setStatus(
            "Please select an image."
        );

        return;
    }


    selectedFile =
        file;


    const url =
        URL.createObjectURL(file);


    preview.src =
        url;


    previewWrapper.style.display =
        "block";


    preview.onload = () => {

        URL.revokeObjectURL(url);

    };


    upscale2xButton.disabled =
        false;

    upscale4xButton.disabled =
        false;

    changeImageButton.disabled =
        false;


    download.style.display =
        "none";


    timing.textContent =
        "";


    setStatus(
        file.name + " ready."
    );
}


/* =========================================================
   IMAGE → TENSOR
   ========================================================= */

function imageToTensor(
    source,
    width,
    height
) {

    const canvas =
        document.createElement("canvas");


    canvas.width =
        width;

    canvas.height =
        height;


    const ctx =
        canvas.getContext(
            "2d",
            {
                willReadFrequently: true
            }
        );


    ctx.drawImage(
        source,
        0,
        0,
        width,
        height
    );


    const imageData =
        ctx.getImageData(
            0,
            0,
            width,
            height
        );


    const pixels =
        imageData.data;


    const pixelCount =
        width * height;


    const tensorData =
        new Float32Array(
            pixelCount * 3
        );


    for (
        let i = 0;
        i < pixelCount;
        i++
    ) {

        const p =
            i * 4;


        tensorData[i] =
            pixels[p] / 255;


        tensorData[
            pixelCount + i
        ] =
            pixels[p + 1] / 255;


        tensorData[
            pixelCount * 2 + i
        ] =
            pixels[p + 2] / 255;
    }


    canvas.width = 1;
    canvas.height = 1;


    return new ort.Tensor(
        "float32",
        tensorData,
        [
            1,
            3,
            height,
            width
        ]
    );
}


/* =========================================================
   TENSOR → CANVAS
   ========================================================= */

function tensorToCanvas(
    tensor
) {

    const width =
        tensor.dims[3];

    const height =
        tensor.dims[2];


    const data =
        tensor.data;


    const pixels =
        new Uint8ClampedArray(
            width * height * 4
        );


    const pixelCount =
        width * height;


    for (
        let i = 0;
        i < pixelCount;
        i++
    ) {

        pixels[i * 4] =
            Math.max(
                0,
                Math.min(
                    255,
                    data[i] * 255
                )
            );


        pixels[i * 4 + 1] =
            Math.max(
                0,
                Math.min(
                    255,
                    data[
                        pixelCount + i
                    ] * 255
                )
            );


        pixels[i * 4 + 2] =
            Math.max(
                0,
                Math.min(
                    255,
                    data[
                        pixelCount * 2 + i
                    ] * 255
                )
            );


        pixels[i * 4 + 3] =
            255;
    }


    const canvas =
        document.createElement("canvas");


    canvas.width =
        width;

    canvas.height =
        height;


    const ctx =
        canvas.getContext("2d");


    const imageData =
        new ImageData(
            pixels,
            width,
            height
        );


    ctx.putImageData(
        imageData,
        0,
        0
    );


    return canvas;
}


/* =========================================================
   FULL IMAGE
   ========================================================= */

async function upscaleFullImage(
    source,
    width,
    height
) {

    setStatus(
        "Preparing image..."
    );


    await frame();


    const preparationStart =
        performance.now();


    const tensor =
        imageToTensor(
            source,
            width,
            height
        );


    const preparationTime =
        (
            performance.now() -
            preparationStart
        ) / 1000;


    console.log(
        "[FLUX] Tensor:",
        preparationTime,
        "seconds"
    );


    setStatus(
        "Running AI upscaling..."
    );


    await frame();


    const inferenceStart =
        performance.now();


    const result =
        await session.run({
            input: tensor
        });


    const inferenceTime =
        (
            performance.now() -
            inferenceStart
        ) / 1000;


    console.log(
        "[FLUX] Inference:",
        inferenceTime,
        "seconds"
    );


    setStatus(
        "Rendering..."
    );


    const output =
        tensorToCanvas(
            result.output
        );


    timing.textContent =
        `Preparation: ${preparationTime.toFixed(2)}s\n` +
        `AI inference: ${inferenceTime.toFixed(2)}s`;


    return output;
}


/* =========================================================
   TILE
   ========================================================= */

async function upscaleTile(
    source,
    x,
    y,
    width,
    height
) {

    const tile =
        document.createElement("canvas");


    tile.width =
        width;

    tile.height =
        height;


    const ctx =
        tile.getContext("2d");


    ctx.drawImage(
        source,
        x,
        y,
        width,
        height,
        0,
        0,
        width,
        height
    );


    const tensor =
        imageToTensor(
            tile,
            width,
            height
        );


    const result =
        await session.run({
            input: tensor
        });


    tile.width = 1;
    tile.height = 1;


    return tensorToCanvas(
        result.output
    );
}


/* =========================================================
   TILED MODE
   ========================================================= */

async function upscaleTiled(
    source,
    width,
    height
) {

    const tileSize =
        deviceProfile.tileSize;


    const output =
        document.createElement("canvas");


    output.width =
        width * 2;

    output.height =
        height * 2;


    const outputCtx =
        output.getContext("2d");


    const columns =
        Math.ceil(
            width / tileSize
        );


    const rows =
        Math.ceil(
            height / tileSize
        );


    const total =
        columns * rows;


    let completed = 0;


    for (
        let y = 0;
        y < height;
        y += tileSize
    ) {

        for (
            let x = 0;
            x < width;
            x += tileSize
        ) {

            const tileWidth =
                Math.min(
                    tileSize,
                    width - x
                );


            const tileHeight =
                Math.min(
                    tileSize,
                    height - y
                );


            completed++;


            setStatus(
                `Upscaling tile ${completed}/${total}...`
            );


            setProgress(
                completed / total * 100
            );


            await frame();


            const result =
                await upscaleTile(
                    source,
                    x,
                    y,
                    tileWidth,
                    tileHeight
                );


            outputCtx.drawImage(
                result,
                x * 2,
                y * 2
            );


            result.width = 1;
            result.height = 1;
        }
    }


    return output;
}


/* =========================================================
   UPSCALE
   ========================================================= */

async function performUpscale(
    scale
) {

    if (busy) {
        return;
    }


    if (!selectedFile) {

        setStatus(
            "Select an image first."
        );

        return;
    }


    busy = true;


    upscale2xButton.disabled = true;
    upscale4xButton.disabled = true;
    changeImageButton.disabled = true;


    try {

        await loadModel();


        setProgress(0);


        setStatus(
            "Decoding image..."
        );


        const bitmap =
            await createImageBitmap(
                selectedFile
            );


        const width =
            bitmap.width;


        const height =
            bitmap.height;


        const megapixels =
            width * height / 1000000;


        if (megapixels > 20) {

            bitmap.close();

            throw new Error(
                "Image exceeds the 20 MP limit."
            );
        }


        /*
         * 2×
         */

        if (scale === 2) {

            let output;


            if (
                usingWebGPU &&
                megapixels <=
                    deviceProfile.fullImageLimitMP
            ) {

                output =
                    await upscaleFullImage(
                        bitmap,
                        width,
                        height
                    );

            } else {

                output =
                    await upscaleTiled(
                        bitmap,
                        width,
                        height
                    );
            }


            bitmap.close();


            showOutput(
                output,
                "flux-upscaled-2x.png"
            );
        }


        /*
         * 4×
         */

        else {

            setStatus(
                "Running first 2× pass..."
            );


            const first =
                usingWebGPU &&
                megapixels <=
                    deviceProfile.fullImageLimitMP
                    ? await upscaleFullImage(
                        bitmap,
                        width,
                        height
                    )
                    : await upscaleTiled(
                        bitmap,
                        width,
                        height
                    );


            bitmap.close();


            await frame();


            setStatus(
                "Running second 2× pass..."
            );


            const secondWidth =
                first.width;


            const secondHeight =
                first.height;


            const secondMP =
                secondWidth *
                secondHeight /
                1000000;


            let second;


            if (
                usingWebGPU &&
                secondMP <=
                    deviceProfile.fullImageLimitMP
            ) {

                second =
                    await upscaleFullImage(
                        first,
                        secondWidth,
                        secondHeight
                    );

            } else {

                second =
                    await upscaleTiled(
                        first,
                        secondWidth,
                        secondHeight
                    );
            }


            first.width = 1;
            first.height = 1;


            showOutput(
                second,
                "flux-upscaled-4x.png"
            );
        }


        setProgress(100);


        setStatus(
            "Upscaling complete."
        );

    } catch (error) {

        console.error(
            "[FLUX ERROR]",
            error
        );


        setStatus(
            "Error: " +
            error.message
        );


        timing.textContent =
            error.stack ||
            error.message;
    }


    busy = false;


    upscale2xButton.disabled = false;
    upscale4xButton.disabled = false;
    changeImageButton.disabled = false;
}


/* =========================================================
   OUTPUT
   ========================================================= */

function showOutput(
    canvas,
    filename
) {

    canvas.toBlob(
        blob => {

            if (!blob) {

                setStatus(
                    "Could not create output."
                );

                return;
            }


            const url =
                URL.createObjectURL(blob);


            preview.src =
                url;


            previewWrapper.style.display =
                "block";


            download.href =
                url;


            download.download =
                filename;


            download.style.display =
                "inline-block";
        },
        "image/png"
    );
}


/* =========================================================
   EVENTS
   ========================================================= */

fileInput.addEventListener(
    "change",
    event => {

        handleFile(
            event.target.files[0]
        );
    }
);


dropZone.addEventListener(
    "dragover",
    event => {

        event.preventDefault();

        dropZone.classList.add(
            "dragging"
        );
    }
);


dropZone.addEventListener(
    "dragleave",
    () => {

        dropZone.classList.remove(
            "dragging"
        );
    }
);


dropZone.addEventListener(
    "drop",
    event => {

        event.preventDefault();

        dropZone.classList.remove(
            "dragging"
        );


        handleFile(
            event.dataTransfer.files[0]
        );
    }
);


upscale2xButton.addEventListener(
    "click",
    () => {

        performUpscale(2);
    }
);


upscale4xButton.addEventListener(
    "click",
    () => {

        performUpscale(4);
    }
);


changeImageButton.addEventListener(
    "click",
    () => {

        fileInput.click();
    }
);


setStatus(
    "Loading AI engine..."
);

</script>

</body>
</html>
