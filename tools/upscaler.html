<script>

/* ==========================================
   FLUX AI UPSCALER
   Adaptive / Memory-Safe Version
========================================== */

const MODEL_URL =
    "https://huggingface.co/skillsafe-ai/realesrgan-x2plus/resolve/main/model.onnx";


/* ==========================================
   ELEMENTS
========================================== */

const dropZone =
    document.getElementById("dropZone");

const fileInput =
    document.getElementById("fileInput");

const previewWrapper =
    document.getElementById("previewWrapper");

const preview =
    document.getElementById("preview");

const imageInfo =
    document.getElementById("imageInfo");

const controls =
    document.getElementById("controls");

const status =
    document.getElementById("status");

const scale2 =
    document.getElementById("scale2");

const scale4 =
    document.getElementById("scale4");

const upscaleButton =
    document.getElementById("upscaleButton");

const changeImageButton =
    document.getElementById("changeImageButton");

const downloadWrapper =
    document.getElementById("downloadWrapper");

const downloadButton =
    document.getElementById("downloadButton");


/* ==========================================
   STATE
========================================== */

let selectedFile = null;

let selectedScale = 2;

let session = null;

let usingWebGPU = false;

let originalWidth = 0;

let originalHeight = 0;

let selectedObjectURL = null;

let currentDownloadURL = null;


/* ==========================================
   ADAPTIVE SETTINGS
========================================== */

/*
 * Large images are automatically tiled.
 *
 * This prevents older laptops from trying to
 * feed the entire image into Real-ESRGAN at once.
 */

const TILE_SIZE_WEAK = 256;

const TILE_SIZE_NORMAL = 384;

const TILE_SIZE_POWERFUL = 512;


/*
 * Images below this size may use normal
 * full-image inference on capable hardware.
 */

const FULL_IMAGE_LIMIT_MP = 3;


/*
 * Hard safety limit.
 */

const MAX_INPUT_MP = 20;


/*
 * Canvas maximum.
 *
 * 32768 is supported by many modern browsers,
 * but we stay conservative.
 */

const MAX_CANVAS_DIMENSION = 16384;


/* ==========================================
   STATUS
========================================== */

function setStatus(message, type = "") {

    status.textContent = message;

    status.className = "status";

    if (type) {
        status.classList.add(type);
    }

}


/* ==========================================
   DEVICE PROFILE
========================================== */

function getDeviceProfile() {

    const cores =
        navigator.hardwareConcurrency || 2;

    const memory =
        navigator.deviceMemory || 4;

    const hasGPU =
        "gpu" in navigator;


    /*
     * Old / weak machine.
     */

    if (
        cores <= 4 ||
        memory <= 4
    ) {

        return {
            name: "conservative",
            tileSize: TILE_SIZE_WEAK,
            fullImage: false
        };

    }


    /*
     * Normal modern machine.
     */

    if (
        cores <= 8 ||
        memory <= 8
    ) {

        return {
            name: "balanced",
            tileSize: TILE_SIZE_NORMAL,
            fullImage: hasGPU
        };

    }


    /*
     * More powerful machine.
     */

    return {
        name: "performance",
        tileSize: TILE_SIZE_POWERFUL,
        fullImage: hasGPU
    };

}


/* ==========================================
   FILE INPUT
========================================== */

dropZone.addEventListener("click", () => {

    fileInput.click();

});


fileInput.addEventListener("change", event => {

    const file =
        event.target.files[0];

    if (file) {
        loadImage(file);
    }

});


/* ==========================================
   DRAG AND DROP
========================================== */

dropZone.addEventListener("dragover", event => {

    event.preventDefault();

    dropZone.classList.add("dragging");

});


dropZone.addEventListener("dragleave", () => {

    dropZone.classList.remove("dragging");

});


dropZone.addEventListener("drop", event => {

    event.preventDefault();

    dropZone.classList.remove("dragging");


    const file =
        event.dataTransfer.files[0];


    if (!file) {
        return;
    }


    if (
        !file.type.startsWith("image/") &&
        !file.name.toLowerCase().endsWith(".jfif")
    ) {

        setStatus(
            "Please select a valid image file.",
            "error"
        );

        return;

    }


    loadImage(file);

});


/* ==========================================
   LOAD IMAGE
========================================== */

function loadImage(file) {

    selectedFile = file;

    downloadWrapper.style.display = "none";


    if (currentDownloadURL) {

        URL.revokeObjectURL(
            currentDownloadURL
        );

        currentDownloadURL = null;

    }


    setStatus("Loading image...");


    if (selectedObjectURL) {

        URL.revokeObjectURL(
            selectedObjectURL
        );

        selectedObjectURL = null;

    }


    selectedObjectURL =
        URL.createObjectURL(file);


    const image =
        new Image();


    image.onload = () => {

        originalWidth =
            image.naturalWidth;

        originalHeight =
            image.naturalHeight;


        preview.src =
            selectedObjectURL;


        previewWrapper.style.display =
            "block";


        controls.style.display =
            "block";


        dropZone.style.display =
            "none";


        imageInfo.textContent =
            `${originalWidth} × ${originalHeight}px`;


        setStatus(
            "Image ready. Choose a scale and upscale."
        );


        image.src = "";

    };


    image.onerror = () => {

        setStatus(
            "This image could not be read by the browser.",
            "error"
        );

    };


    image.src =
        selectedObjectURL;

}


/* ==========================================
   CHANGE IMAGE
========================================== */

changeImageButton.addEventListener("click", () => {

    fileInput.value = "";

    fileInput.click();

});


/* ==========================================
   SCALE BUTTONS
========================================== */

scale2.addEventListener("click", () => {

    selectedScale = 2;

    scale2.classList.add("selected");

    scale4.classList.remove("selected");

});


scale4.addEventListener("click", () => {

    selectedScale = 4;

    scale4.classList.add("selected");

    scale2.classList.remove("selected");

});


/* ==========================================
   LOAD MODEL
========================================== */

async function loadModel() {

    if (session) {
        return session;
    }


    /*
     * Try real WebGPU initialisation.
     */

    if ("gpu" in navigator) {

        try {

            setStatus(
                "Testing GPU acceleration..."
            );


            session =
                await ort.InferenceSession.create(
                    MODEL_URL,
                    {
                        executionProviders: [
                            "webgpu"
                        ],
                        graphOptimizationLevel: "all"
                    }
                );


            usingWebGPU = true;


            console.log(
                "FLUX: WebGPU enabled."
            );


            return session;

        } catch (error) {

            console.warn(
                "FLUX: WebGPU unavailable.",
                error
            );


            session = null;

        }

    }


    /*
     * WASM fallback.
     */

    try {

        setStatus(
            "Using CPU mode. Optimising for this device..."
        );


        session =
            await ort.InferenceSession.create(
                MODEL_URL,
                {
                    executionProviders: [
                        "wasm"
                    ],
                    graphOptimizationLevel: "all"
                }
            );


        usingWebGPU = false;


        console.log(
            "FLUX: WASM CPU mode enabled."
        );


        return session;

    } catch (error) {

        console.error(
            "FLUX: Model loading failed.",
            error
        );


        throw new Error(
            "Could not load the AI model: " +
            error.message
        );

    }

}


/* ==========================================
   CREATE IMAGE
========================================== */

async function decodeImage(source) {

    return new Promise((resolve, reject) => {

        const image =
            new Image();


        image.onload = () => {

            resolve(image);

        };


        image.onerror = () => {

            reject(
                new Error(
                    "The selected image could not be decoded."
                )
            );

        };


        image.src = source;

    });

}


/* ==========================================
   IMAGE → TENSOR
========================================== */

function canvasToTensor(
    canvas
) {

    const width =
        canvas.width;

    const height =
        canvas.height;


    const ctx =
        canvas.getContext(
            "2d",
            {
                willReadFrequently: true
            }
        );


    if (!ctx) {

        throw new Error(
            "Could not create canvas context."
        );

    }


    const imageData =
        ctx.getImageData(
            0,
            0,
            width,
            height
        );


    const pixelCount =
        width * height;


    const tensorData =
        new Float32Array(
            pixelCount * 3
        );


    const greenOffset =
        pixelCount;

    const blueOffset =
        pixelCount * 2;


    for (
        let i = 0, p = 0;
        i < pixelCount;
        i++, p += 4
    ) {

        tensorData[i] =
            imageData.data[p] / 255;


        tensorData[
            greenOffset + i
        ] =
            imageData.data[p + 1] / 255;


        tensorData[
            blueOffset + i
        ] =
            imageData.data[p + 2] / 255;

    }


    return new ort.Tensor(
        "float32",
        tensorData,
        [
            1,
            3,
            height,
            width
        ]
    );

}


/* ==========================================
   MODEL OUTPUT → CANVAS
========================================== */

function outputToCanvas(
    outputTensor,
    width,
    height
) {

    const dims =
        outputTensor.dims;

    const data =
        outputTensor.data;


    const outputWidth =
        dims[3];

    const outputHeight =
        dims[2];


    const canvas =
        document.createElement("canvas");


    canvas.width =
        outputWidth;

    canvas.height =
        outputHeight;


    const ctx =
        canvas.getContext("2d");


    if (!ctx) {

        throw new Error(
            "Could not create output canvas."
        );

    }


    const imageData =
        ctx.createImageData(
            outputWidth,
            outputHeight
        );


    const planeSize =
        outputWidth *
        outputHeight;


    const greenOffset =
        planeSize;

    const blueOffset =
        planeSize * 2;


    for (
        let i = 0;
        i < planeSize;
        i++
    ) {

        const p =
            i * 4;


        imageData.data[p] =
            Math.max(
                0,
                Math.min(
                    255,
                    Math.round(
                        data[i] * 255
                    )
                )
            );


        imageData.data[p + 1] =
            Math.max(
                0,
                Math.min(
                    255,
                    Math.round(
                        data[
                            greenOffset + i
                        ] * 255
                    )
                )
            );


        imageData.data[p + 2] =
            Math.max(
                0,
                Math.min(
                    255,
                    Math.round(
                        data[
                            blueOffset + i
                        ] * 255
                    )
                )
            );


        imageData.data[p + 3] =
            255;

    }


    ctx.putImageData(
        imageData,
        0,
        0
    );


    return canvas;

}


/* ==========================================
   FULL IMAGE 2×
========================================== */

async function upscaleFullImage(
    imageSource
) {

    const ai =
        await loadModel();


    const image =
        await decodeImage(
            imageSource
        );


    const width =
        image.naturalWidth;

    const height =
        image.naturalHeight;


    const megapixels =
        width *
        height /
        1000000;


    if (
        megapixels >
        MAX_INPUT_MP
    ) {

        throw new Error(
            `Image is ${megapixels.toFixed(1)} MP. ` +
            `Maximum supported input is ${MAX_INPUT_MP} MP.`
        );

    }


    setStatus(
        `Preparing ${width} × ${height}px image...`
    );


    /*
     * Real-ESRGAN expects even dimensions.
     */

    const paddedWidth =
        width % 2 === 0
            ? width
            : width + 1;


    const paddedHeight =
        height % 2 === 0
            ? height
            : height + 1;


    const canvas =
        document.createElement("canvas");


    canvas.width =
        paddedWidth;

    canvas.height =
        paddedHeight;


    const ctx =
        canvas.getContext(
            "2d",
            {
                willReadFrequently: true
            }
        );


    ctx.drawImage(
        image,
        0,
        0,
        width,
        height
    );


    /*
     * Extend odd edges.
     */

    if (
        paddedWidth !== width
    ) {

        ctx.drawImage(
            canvas,
            width - 1,
            0,
            1,
            height,
            width,
            0,
            1,
            height
        );

    }


    if (
        paddedHeight !== height
    ) {

        ctx.drawImage(
            canvas,
            0,
            height - 1,
            paddedWidth,
            1,
            0,
            height,
            paddedWidth,
            1
        );

    }


    setStatus(
        `Preparing AI tensor (${paddedWidth} × ${paddedHeight})...`
    );


    const tensor =
        canvasToTensor(canvas);


    /*
     * Release source canvas before inference.
     */

    canvas.width = 1;
    canvas.height = 1;


    setStatus(
        `Running AI on ${paddedWidth} × ${paddedHeight}px ` +
        `using ${usingWebGPU ? "GPU" : "CPU"}...`
    );


    const results =
        await ai.run({
            input: tensor
        });


    const output =
        results.output;


    if (!output) {

        throw new Error(
            "The AI model returned no output."
        );

    }


    const result =
        outputToCanvas(
            output,
            width * 2,
            height * 2
        );


    image.src = "";


    return result;

}


/* ==========================================
   SINGLE TILE
========================================== */

async function upscaleTile(
    ai,
    sourceCanvas,
    x,
    y,
    width,
    height
) {

    /*
     * Real-ESRGAN needs even dimensions.
     */

    const inputWidth =
        width % 2 === 0
            ? width
            : width + 1;


    const inputHeight =
        height % 2 === 0
            ? height
            : height + 1;


    const tileCanvas =
        document.createElement("canvas");


    tileCanvas.width =
        inputWidth;

    tileCanvas.height =
        inputHeight;


    const tileCtx =
        tileCanvas.getContext(
            "2d",
            {
                willReadFrequently: true
            }
        );


    tileCtx.drawImage(
        sourceCanvas,
        x,
        y,
        width,
        height,
        0,
        0,
        width,
        height
    );


    /*
     * Fill odd edges.
     */

    if (
        inputWidth !== width
    ) {

        tileCtx.drawImage(
            tileCanvas,
            width - 1,
            0,
            1,
            height,
            width,
            0,
            1,
            height
        );

    }


    if (
        inputHeight !== height
    ) {

        tileCtx.drawImage(
            tileCanvas,
            0,
            height - 1,
            inputWidth,
            1,
            0,
            height,
            inputWidth,
            1
        );

    }


    const tensor =
        canvasToTensor(
            tileCanvas
        );


    /*
     * Release the tile canvas before
     * GPU inference.
     */

    tileCanvas.width = 1;
    tileCanvas.height = 1;


    const results =
        await ai.run({
            input: tensor
        });


    const output =
        results.output;


    if (!output) {

        throw new Error(
            "The AI model returned no output."
        );

    }


    return output;

}


/* ==========================================
   TILED 2×
========================================== */

async function upscaleTiled(
    imageSource,
    tileSize
) {

    const ai =
        await loadModel();


    const image =
        await decodeImage(
            imageSource
        );


    const width =
        image.naturalWidth;

    const height =
        image.naturalHeight;


    const megapixels =
        width *
        height /
        1000000;


    if (
        megapixels >
        MAX_INPUT_MP
    ) {

        throw new Error(
            `Image is ${megapixels.toFixed(1)} MP. ` +
            `Maximum supported input is ${MAX_INPUT_MP} MP.`
        );

    }


    const outputWidth =
        width * 2;

    const outputHeight =
        height * 2;


    if (
        outputWidth >
        MAX_CANVAS_DIMENSION ||
        outputHeight >
        MAX_CANVAS_DIMENSION
    ) {

        throw new Error(
            "The resulting image would exceed safe browser canvas limits."
        );

    }


    /*
     * Full source canvas.
     */

    const sourceCanvas =
        document.createElement("canvas");


    sourceCanvas.width =
        width;

    sourceCanvas.height =
        height;


    const sourceCtx =
        sourceCanvas.getContext("2d");


    sourceCtx.drawImage(
        image,
        0,
        0
    );


    /*
     * Final output.
     */

    const outputCanvas =
        document.createElement("canvas");


    outputCanvas.width =
        outputWidth;

    outputCanvas.height =
        outputHeight;


    const outputCtx =
        outputCanvas.getContext("2d");


    const tilesX =
        Math.ceil(
            width /
            tileSize
        );


    const tilesY =
        Math.ceil(
            height /
            tileSize
        );


    const totalTiles =
        tilesX *
        tilesY;


    let tileNumber = 0;


    for (
        let y = 0;
        y < height;
        y += tileSize
    ) {

        for (
            let x = 0;
            x < width;
            x += tileSize
        ) {

            tileNumber++;


            const tileWidth =
                Math.min(
                    tileSize,
                    width - x
                );


            const tileHeight =
                Math.min(
                    tileSize,
                    height - y
                );


            setStatus(
                `Upscaling tile ${tileNumber}/${totalTiles} ` +
                `(${usingWebGPU ? "GPU" : "CPU"})...`
            );


            const output =
                await upscaleTile(
                    ai,
                    sourceCanvas,
                    x,
                    y,
                    tileWidth,
                    tileHeight
                );


            const outputWidthTile =
                output.dims[3];

            const outputHeightTile =
                output.dims[2];


            const tileCanvas =
                outputToCanvas(
                    output,
                    outputWidthTile,
                    outputHeightTile
                );


            /*
             * Put the processed tile into
             * the final image.
             */

            outputCtx.drawImage(
                tileCanvas,
                x * 2,
                y * 2
            );


            /*
             * Release tile immediately.
             */

            tileCanvas.width = 1;
            tileCanvas.height = 1;


            /*
             * Give the browser a frame between
             * tiles. This prevents the UI from
             * appearing completely frozen.
             */

            await new Promise(
                resolve =>
                    requestAnimationFrame(resolve)
            );

        }

    }


    /*
     * Release source resources.
     */

    sourceCanvas.width = 1;
    sourceCanvas.height = 1;

    image.src = "";


    return outputCanvas;

}


/* ==========================================
   SMART 2× UPSCALE
========================================== */

async function upscale2x(
    imageSource
) {

    const image =
        await decodeImage(
            imageSource
        );


    const width =
        image.naturalWidth;

    const height =
        image.naturalHeight;


    const megapixels =
        width *
        height /
        1000000;


    image.src = "";


    if (
        megapixels >
        MAX_INPUT_MP
    ) {

        throw new Error(
            `This image is ${megapixels.toFixed(1)} MP. ` +
            `Please use an image below ${MAX_INPUT_MP} MP.`
        );

    }


    const profile =
        getDeviceProfile();


    console.log(
        "FLUX device profile:",
        profile
    );


    /*
     * Once the model is loaded, we know whether
     * WebGPU is genuinely available.
     */

    await loadModel();


    /*
     * Small images on capable machines:
     * use full-image inference.
     */

    if (
        megapixels <= FULL_IMAGE_LIMIT_MP &&
        profile.fullImage &&
        usingWebGPU
    ) {

        setStatus(
            "Using fast GPU mode..."
        );


        return await upscaleFullImage(
            imageSource
        );

    }


    /*
     * Otherwise use tiled inference.
     *
     * This is the important part for your
     * old laptop.
     */

    let tileSize =
        profile.tileSize;


    /*
     * CPU mode gets the smallest tiles.
     */

    if (!usingWebGPU) {

        tileSize =
            TILE_SIZE_WEAK;

    }


    setStatus(
        `Using memory-safe ${tileSize}px tiles...`
    );


    return await upscaleTiled(
        imageSource,
        tileSize
    );

}


/* ==========================================
   CANVAS → BLOB
========================================== */

function canvasToBlob(
    canvas
) {

    return new Promise(
        (resolve, reject) => {

            canvas.toBlob(
                blob => {

                    if (blob) {
                        resolve(blob);
                    } else {
                        reject(
                            new Error(
                                "Could not create image file."
                            )
                        );
                    }

                },
                "image/png"
            );

        }
    );

}


/* ==========================================
   UPSCALE BUTTON
========================================== */

upscaleButton.addEventListener(
    "click",
    async () => {

        if (
            !selectedFile ||
            !selectedObjectURL
        ) {

            setStatus(
                "Please select an image first.",
                "error"
            );

            return;

        }


        upscaleButton.disabled =
            true;


        downloadWrapper.style.display =
            "none";


        try {

            let resultCanvas;


            /*
             * 2×
             */

            if (
                selectedScale === 2
            ) {

                resultCanvas =
                    await upscale2x(
                        selectedObjectURL
                    );

            }


            /*
             * 4×
             */

            else {

                setStatus(
                    "Running first 2× AI pass..."
                );


                const firstPass =
                    await upscale2x(
                        selectedObjectURL
                    );


                setStatus(
                    "Encoding first AI pass..."
                );


                const firstBlob =
                    await canvasToBlob(
                        firstPass
                    );


                const firstURL =
                    URL.createObjectURL(
                        firstBlob
                    );


                /*
                 * Release first-pass canvas.
                 */

                firstPass.width = 1;
                firstPass.height = 1;


                try {

                    setStatus(
                        "Running second 2× AI pass..."
                    );


                    resultCanvas =
                        await upscale2x(
                            firstURL
                        );

                } finally {

                    URL.revokeObjectURL(
                        firstURL
                    );

                }

            }


            /*
             * Encode final image without
             * creating a huge base64 string.
             */

            setStatus(
                "Preparing download..."
            );


            const resultBlob =
                await canvasToBlob(
                    resultCanvas
                );


            const resultURL =
                URL.createObjectURL(
                    resultBlob
                );


            if (currentDownloadURL) {

                URL.revokeObjectURL(
                    currentDownloadURL
                );

            }


            currentDownloadURL =
                resultURL;


            preview.src =
                resultURL;


            imageInfo.textContent =
                `${resultCanvas.width} × ${resultCanvas.height}px`;


            downloadButton.href =
                resultURL;


            downloadButton.download =
                selectedScale === 2
                    ? "flux-upscaled-2x.png"
                    : "flux-upscaled-4x.png";


            downloadWrapper.style.display =
                "block";


            setStatus(
                `Upscaling complete: ` +
                `${resultCanvas.width} × ` +
                `${resultCanvas.height}px`,
                "success"
            );


            /*
             * Release canvas memory.
             */

            resultCanvas.width = 1;
            resultCanvas.height = 1;


        } catch (error) {

            console.error(
                "FLUX Upscaler error:",
                error
            );


            setStatus(
                "Upscaling failed: " +
                (
                    error.message ||
                    "Unknown error"
                ),
                "error"
            );

        } finally {

            upscaleButton.disabled =
                false;

        }

    }
);


/* ==========================================
   CLEANUP
========================================== */

window.addEventListener(
    "beforeunload",
    () => {

        if (selectedObjectURL) {

            URL.revokeObjectURL(
                selectedObjectURL
            );

        }


        if (currentDownloadURL) {

            URL.revokeObjectURL(
                currentDownloadURL
            );

        }

    }
);

</script>
